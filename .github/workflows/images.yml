name: Publier les images Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Construire et publier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          REGISTRE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --target execution --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$REGISTRE/codicillus:$VERSION" .
          docker build --target gestion --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$REGISTRE/codicillus-gestion:$VERSION" .
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$REGISTRE/codicillus-conversion:$VERSION" services/conversion
          docker push "$REGISTRE/codicillus:$VERSION"
          docker push "$REGISTRE/codicillus-gestion:$VERSION"
          docker push "$REGISTRE/codicillus-conversion:$VERSION"
          docker logout ghcr.io
