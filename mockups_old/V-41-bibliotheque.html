/* Libellé du signal de fraîcheur, toujours accompagné de sa valeur en clair. */
window.libelleFraicheur = function (n) {
  if (n.fraicheur === "frais") {
    return n.jours < 31 ? "Vérifié il y a " + n.jours + " jours" : "Vérifié il y a 1 mois";
  }
  var mois = Math.round(n.jours / 30);
  if (n.fraicheur === "vieil") return "Vérifié il y a " + mois + " mois";
  return "Pas revu depuis " + mois + " mois";
};

window.barresFraicheur = function (niv) {

};

/* Le témoin de fraîcheur est la signature du produit : il n'existe qu'une
   seule fabrique, pour qu'il ne puisse pas diverger d'un écran à l'autre. */
window.temoinFraicheur = function (n) {
  var s = document.createElement("span");

  var j = document.createElement("span");
  j.className = "temoin__jauge";
  j.setAttribute("aria-hidden", "true");
  var plein = window.barresFraicheur(n.fraicheur);
  for (var k = 0; k < 3; k++) {
    var i = document.createElement("i");
    if (k < plein) i.className = "plein";
    j.appendChild(i);
  }
  var t = document.createElement("span");
  t.className = "temoin__txt";
  t.textContent = window.libelleFraicheur(n);
  s.appendChild(j);
  s.appendChild(t);
  return s;
};

/* Marque les termes de la requête dans un texte, sans jamais injecter de HTML
   issu de la saisie. */
window.surligner = function (texte, requete) {
  var frag = document.createDocumentFragment();
  var termes = (requete || "").toLowerCase().split(/\s+/).filter(function (t) { return t.length > 2; });
  if (!termes.length) { frag.appendChild(document.createTextNode(texte)); return frag; }
  var motif = new RegExp("(" + termes.map(function (t) {
    return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }).join("|") + ")", "ig");
  var reste = texte, m;
  motif.lastIndex = 0;
  var dernier = 0;
  while ((m = motif.exec(texte)) !== null) {
    if (m.index > dernier) frag.appendChild(document.createTextNode(texte.slice(dernier, m.index)));
    var mk = document.createElement("mark");
    mk.textContent = m[0];
    frag.appendChild(mk);
    dernier = m.index + m[0].length;
    if (m.index === motif.lastIndex) motif.lastIndex++;
  }
  if (dernier < texte.length) frag.appendChild(document.createTextNode(texte.slice(dernier)));
  return frag;
};

/* Correspondance tolérante : la requête est découpée en termes, un résultat
   sort s'il porte tous les termes dans son titre, son extrait ou ses étiquettes. */
window.chercher = function (requete) {
  var termes = (requete || "").toLowerCase().split(/\s+/).filter(Boolean);
  if (!termes.length) return [];
  return window.CORPUS.filter(function (n) {
    var champ = (n.titre + " " + n.extrait + " " + n.etiquettes.join(" ") + " " + n.domaine + " " + (n.typeFiche || "")).toLowerCase();
    return termes.every(function (t) {
      if (champ.indexOf(t) !== -1) return true;
      /* tolérance simple : racine de 4 caractères, suffisante pour la maquette */
      return t.length > 4 && champ.indexOf(t.slice(0, Math.max(4, t.length - 2))) !== -1;
    });
  });
};

window.blocEnLignes = function (b) {
  switch (b.type) {
    case "h2": return ["## " + b.texte];
    case "h3": return ["### " + b.texte];
    case "p": return [b.texte];
    case "liste": return b.items.map(function (i) { return "- " + i; });
    case "taches": return b.items.map(function (i) { return "- [ ] " + i; });
    case "code": return ["```" + b.langage].concat(b.lignes).concat(["```"]);
    case "alerte": return [":::" + b.niveau + " " + b.titre, b.texte, ":::"];
    case "figure": return ["![schéma] " + b.legende];
    case "tableau": return ["| " + b.entetes.join(" | ") + " |"]
      .concat(b.lignes.map(function (l) { return "| " + l.join(" | ") + " |"; }));
    default: return [""];
  }
};

/* Plus longue sous-séquence commune : sert à aligner les lignes en mode Texte
   et les blocs en mode Visuel. Même algorithme, deux granularités. */
window.alignement = function (a, b, cle) {
  cle = cle || function (x) { return x; };
  var n = a.length, m = b.length;
  var t = [];
  for (var i = 0; i <= n; i++) { t.push(new Array(m + 1).fill(0)); }
  for (i = n - 1; i >= 0; i--) {
    for (var j = m - 1; j >= 0; j--) {
      t[i][j] = cle(a[i]) === cle(b[j]) ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
    }
  }
  var res = [];
  i = 0; j = 0;
  while (i < n && j < m) {
    if (cle(a[i]) === cle(b[j])) { res.push({ etat: "commun", a: a[i], b: b[j] }); i++; j++; }
    else if (t[i + 1][j] >= t[i][j + 1]) { res.push({ etat: "retire", a: a[i] }); i++; }
    else { res.push({ etat: "ajoute", b: b[j] }); j++; }
  }
  while (i < n) { res.push({ etat: "retire", a: a[i] }); i++; }
  while (j < m) { res.push({ etat: "ajoute", b: b[j] }); j++; }
  return res;
};

/* Sous-graphe d'un périmètre. Les notes hors périmètre mais reliées à lui sont
   conservées et marquées « fantôme » : les masquer donnerait une fausse image
   des dépendances. */
window.sousGraphe = function (perimetre) {
  var dedans = function (n) {
    if (!perimetre || perimetre.type === "global") return true;
    if (perimetre.type === "univers") return n.univers === perimetre.nom;
    return n.domaine === perimetre.nom;
  };
  var noeuds = {};
  window.CORPUS.forEach(function (n) { if (dedans(n)) noeuds[n.id] = { note: n, fantome: false }; });

  var aretes = window.RELATIONS.filter(function (r) {
    return noeuds[r.de] || noeuds[r.vers];
  });
  aretes.forEach(function (r) {
    [r.de, r.vers].forEach(function (id) {
      if (noeuds[id]) return;
      var n = window.CORPUS.filter(function (x) { return x.id === id; })[0];
      if (n) noeuds[id] = { note: n, fantome: true };
    });
  });

  /* Seules les notes effectivement reliées composent le graphe. */
  var relies = {};
  aretes.forEach(function (r) { relies[r.de] = true; relies[r.vers] = true; });
  Object.keys(noeuds).forEach(function (id) { if (!relies[id]) delete noeuds[id]; });

  return { noeuds: noeuds, aretes: aretes };
};

/* Relations qui portent une dépendance technique. Une note qui en documente
   une autre n'en dépend pas : inclure « documente » dans le calcul ferait
   passer pour points de rupture toutes les fiches simplement documentées. */
window.RELATIONS_TECHNIQUES = ["heberge", "depend", "replique", "sauvegarde"];

/* Points d'articulation : un nœud dont le retrait couperait le graphe des
   dépendances techniques en morceaux. Ce sont les points de défaillance unique
   du périmètre. Parcours en profondeur, algorithme de Hopcroft et Tarjan. */
window.pointsArticulation = function (graphe) {
  var voisins = {};
  Object.keys(graphe.noeuds).forEach(function (id) { voisins[id] = []; });
  graphe.aretes.forEach(function (r) {
    if (!voisins[r.de] || !voisins[r.vers]) return;
    if (window.RELATIONS_TECHNIQUES.indexOf(r.type) === -1) return;
    voisins[r.de].push(r.vers);
    voisins[r.vers].push(r.de);
  });

  var visite = {}, decouverte = {}, bas = {}, parent = {}, articulation = {}, temps = 0;

  function parcourir(u) {
    var enfants = 0;
    visite[u] = true;
    decouverte[u] = bas[u] = ++temps;
    voisins[u].forEach(function (v) {
      if (!visite[v]) {
        enfants++;
        parent[v] = u;
        parcourir(v);
        bas[u] = Math.min(bas[u], bas[v]);
        if (parent[u] === undefined && enfants > 1) articulation[u] = true;
        if (parent[u] !== undefined && bas[v] >= decouverte[u]) articulation[u] = true;
      } else if (v !== parent[u]) {
        bas[u] = Math.min(bas[u], decouverte[v]);
      }
    });
  }

  Object.keys(voisins).forEach(function (id) { if (!visite[id]) parcourir(id); });
  return articulation;
};

window.degres = function (graphe) {
  var d = {};
  Object.keys(graphe.noeuds).forEach(function (id) { d[id] = 0; });
  graphe.aretes.forEach(function (r) {
    if (d[r.de] !== undefined) d[r.de]++;
    if (d[r.vers] !== undefined) d[r.vers]++;
  });
  return d;
};

  /* ---------- Fil d'Ariane et page courante ----------
     Chaque vue déclare son chemin : coquille({ fil: [...], courant: [...] }).
     Le dernier segment du fil n'est pas cliquable, les ancêtres le sont.
     Les nœuds nommés dans « courant » sont mis en évidence et leurs ancêtres
     dépliés automatiquement. */
  window.coquille = function (opts) {
    opts = opts || {};
    var fil = document.getElementById("fil");
    if (fil && opts.fil) {
      fil.innerHTML = "";
      opts.fil.forEach(function (seg, k) {
        if (k) {
          var sep = document.createElement("span");
          sep.textContent = "\u203A";
          fil.appendChild(sep);
        }
        var dernier = k === opts.fil.length - 1;
        var el = document.createElement(dernier ? "span" : "a");
        if (dernier) { el.className = "fil__courant"; }
        else {
          el.href = "#";
          el.addEventListener("click", function (e) {
            e.preventDefault();
            railNaviguer("Retour vers « " + seg + " »");
          });
        }
        el.textContent = seg;
        fil.appendChild(el);
      });
    }

    document.querySelectorAll(".noeud--courant").forEach(function (n) {
      n.classList.remove("noeud--courant");
      n.querySelectorAll("[aria-current]").forEach(function (a) { a.removeAttribute("aria-current"); });
    });

    (opts.courant || []).forEach(function (nom, k, tab) {
      document.querySelectorAll(".noeud__nom").forEach(function (a) {
        if (a.textContent.trim() !== nom) return;
        a.closest(".noeud").classList.add("noeud--courant");
        if (k === tab.length - 1) a.setAttribute("aria-current", "page");
        var li = a.closest("li");
        while (li) {
          li.setAttribute("data-ouvert", "oui");
          var chev = li.querySelector(":scope > .noeud > .noeud__chevron");
          if (chev) chev.setAttribute("aria-expanded", "true");
          var n = li.querySelector(":scope > .noeud");
          if (n) n.setAttribute("data-ouvert", "oui");
          li = li.parentElement.closest("li");
        }
      });
    });
  };

    /* ============== BARRE DE RÉPARTITION DE FRAÎCHEUR ==============
     Rend la barre proportionnelle et sa légende chiffrée pour un ensemble de
     notes. Chaque part est cliquable et mène à la liste pré-filtrée sur le
     niveau correspondant.

     barreRepartition(notes, { surPart(niveau, compte), contexte, sansLegende })
     Renvoie un fragment de document, ou un message si l'ensemble est vide. */
  function barreRepartition(notes, o) {
    o = o || {};
    var r = window.repartitionFraicheur(notes);
    var frag = document.createDocumentFragment();

    if (!r.total) {
      var vide = document.createElement("div");
      vide.className = "zone-etat__txt";
      vide.style.margin = "0";
      vide.textContent = "Aucune note à mesurer.";
      frag.appendChild(vide);
      return frag;
    }

    var PARTS = [
      { cle: "frais", classe: "p-frais", pluriel: "fraîches",      singulier: "fraîche" },
      { cle: "vieil", classe: "p-vieil", pluriel: "vieillissantes", singulier: "vieillissante" },
      { cle: "obs",   classe: "p-obs",   pluriel: "obsolètes",     singulier: "obsolète" }
    ];

    var barre = document.createElement("div");
    barre.className = "repart";
    barre.setAttribute("role", "img");
    barre.setAttribute("aria-label",
      PARTS.filter(function (p) { return r[p.cle]; })
        .map(function (p) { return r[p.cle] + " " + (r[p.cle] > 1 ? p.pluriel : p.singulier); })
        .join(", ") + " sur " + r.total);

    PARTS.forEach(function (p) {
      if (!r[p.cle]) return;
      var b = document.createElement("button");
      b.type = "button";
      b.className = p.classe;
      b.style.flex = String(r[p.cle]);
      var libelle = r[p.cle] + " " + (r[p.cle] > 1 ? p.pluriel : p.singulier) +
        (o.contexte ? " · " + o.contexte : "");
      b.title = libelle;
      b.setAttribute("aria-label", libelle);
      b.addEventListener("click", function () {
        if (o.surPart) o.surPart(p.cle, r[p.cle], p.pluriel);
      });
      barre.appendChild(b);
    });
    frag.appendChild(barre);

    if (o.sansLegende) return frag;

    var leg = document.createElement("div");
    leg.className = "legende";
    PARTS.forEach(function (p) {
      if (!r[p.cle]) return;
      var s = document.createElement("span");
      var i = document.createElement("i");
      i.className = p.classe;
      var b = document.createElement("b");
      b.textContent = r[p.cle];
      s.appendChild(i);
      s.appendChild(b);
      s.appendChild(document.createTextNode(" " + (r[p.cle] > 1 ? p.pluriel : p.singulier)));
      leg.appendChild(s);
    });
    frag.appendChild(leg);
    return frag;
  }

    /* ======================= CARTE DE RÉSULTAT =======================
     Composant commun à V-08 (recherche interne) et V-02 (recherche publique).
     La variante publique est une amputation, jamais une réécriture : elle
     retire le brouillon, la visibilité, le marquage de registre et les
     étiquettes internes. Tout le reste — signal de fraîcheur, date de
     dernière révision en clair, consultations — est identique. */

  var GLYPHES = { "Procédure": "PRO", "Guide": "GUI", "Fiche": "FIC", "Note": "NOT", "Signet": "LIE" };


  function past(txt, cls) {
    var s = document.createElement("span");
    s.className = "past" + (cls ? " " + cls : "");
    s.textContent = txt;
    return s;
  }

  function nombre(x) { return x.toLocaleString("fr-FR"); }

  /* opts : { publique, surSelection, surOuverture } */
  function carte(n, requete, index, opts) {
    opts = opts || {};

    /* Un lien, non un bouton : la carte porte un titre de niveau 2 et reste
       un élément de navigation — ouverture par Entrée sans code. */
    var b = document.createElement("a");
    b.className = "carte" + (opts.publique ? " carte--publique" : "");
    b.href = "#";
    b.setAttribute("data-index", index);

    /* --- Haut : titre et marqueurs --- */
    var haut = document.createElement("div");
    haut.className = "carte__haut";
    var h = document.createElement("h2");
    h.className = "carte__titre";
    h.appendChild(window.surligner(n.titre, requete));
    haut.appendChild(h);
    if (n.brouillon && !opts.publique) haut.appendChild(past("Brouillon", "past--brouillon"));
    haut.appendChild(past(n.type === "Fiche" ? "Fiche " + n.typeFiche : n.type, "past--type"));
    b.appendChild(haut);

    if (n.type === "Signet") {
      var u = document.createElement("div");
      u.className = "marque-signet";
      u.style.marginBottom = "var(--e-2)";
      u.textContent = "↗ " + n.url;
      b.appendChild(u);
    }

    /* --- Extrait --- */
    var ex = document.createElement("p");
    ex.className = "carte__extrait";
    ex.appendChild(window.surligner(n.extrait, requete));
    b.appendChild(ex);

    /* --- Bande de confiance : signal et date de révision en clair ---
       Isolée entre deux filets, au même endroit sur chaque carte, pour qu'un
       balayage vertical de la liste lise tous les signaux d'un coup. */
    var sig = document.createElement("div");
    sig.className = "carte__signal";
    sig.appendChild(window.temoinFraicheur(n));
    var rev = document.createElement("span");
    rev.className = "carte__revision";
    if (n.revise) {
      rev.textContent = "Révisé le " + n.revise;
    } else {
      rev.textContent = "Jamais révisé";
      rev.setAttribute("data-jamais", "oui");
    }
    sig.appendChild(rev);
    if (n.operationnel && !opts.publique) {
      var op = document.createElement("span");
      op.className = "marque-op";
      op.textContent = "↳ Trouvé dans le registre Opérationnel";
      sig.appendChild(op);
    }
    b.appendChild(sig);

    /* --- Pied : rangement, auteur, mesures --- */
    var pied = document.createElement("div");
    pied.className = "carte__pied";
    function pt() { var s = document.createElement("span"); s.className = "sep"; s.textContent = "·"; return s; }

    var chemin = document.createElement("span");
    chemin.className = "carte__chemin";
    if (opts.publique) {
      /* Le rangement interne n'est pas exposé : seul le domaine l'est. */
      var d0 = document.createElement("b"); d0.textContent = n.domaine;
      chemin.appendChild(d0);
    } else {
      var uni = document.createElement("span"); uni.textContent = n.univers + " › ";
      var dom = document.createElement("b"); dom.textContent = n.domaine;
      var dos = document.createElement("span"); dos.textContent = " › " + n.dossier;
      chemin.appendChild(uni); chemin.appendChild(dom); chemin.appendChild(dos);
    }
    pied.appendChild(chemin);

    pied.appendChild(pt());
    var aut = document.createElement("span"); aut.textContent = n.auteur; pied.appendChild(aut);

    pied.appendChild(pt());
    var vues = document.createElement("span");
    vues.textContent = nombre(n.vues) + " consultations";
    pied.appendChild(vues);

    if (n.pj) {
      pied.appendChild(pt());
      var pj = document.createElement("span");
      pj.textContent = n.pj + (n.pj > 1 ? " pièces jointes" : " pièce jointe");
      pied.appendChild(pj);
    }
    if (n.visibilite === "Publique" && !opts.publique) {
      pied.appendChild(pt());
      var vis = document.createElement("span");
      vis.className = "carte__visibilite";
      vis.textContent = "Publique";
      pied.appendChild(vis);
    }
    b.appendChild(pied);

    b.addEventListener("click", function (e) {
      e.preventDefault();
      if (opts.surOuverture) opts.surOuverture(n);
    });
    if (opts.surSelection) {
      b.addEventListener("mousemove", function () { opts.surSelection(index); });
    }
    return b;
  }

    /* ====================== SAISIE D'ÉTIQUETTES ======================
     Auto-complétion sur les étiquettes existantes du corpus, avec leur
     fréquence : proposer « #postgresql · 6 notes » plutôt qu'une simple
     correspondance oriente vers le vocabulaire déjà en usage, et c'est ce qui
     évite qu'une même idée s'écrive de trois façons.

     La création d'une étiquette inédite est proposée explicitement, marquée
     « créer » : elle ne doit jamais arriver par inadvertance.

     creerEtiquettes({ boite, champ, suggestions, valeurs, surChangement }) */
  function creerEtiquettes(o) {
    var liste = (o.valeurs || []).slice();
    var sel = -1;

    function rendre() {
      o.boite.querySelectorAll(".etq").forEach(function (e) { e.remove(); });
      liste.forEach(function (e) {
        var s = document.createElement("span");
        s.className = "etq";
        s.appendChild(document.createTextNode(e));
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", "Retirer l'étiquette " + e);
        b.innerHTML = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
        b.addEventListener("click", function () {
          liste = liste.filter(function (x) { return x !== e; });
          rendre();
          if (o.surChangement) o.surChangement(liste.slice());
        });
        s.appendChild(b);
        o.boite.insertBefore(s, o.champ);
      });
    }

    function ajouter(v) {
      v = String(v || "").trim().toLowerCase();
      if (!v || liste.indexOf(v) !== -1) return;
      liste.push(v);
      o.champ.value = "";
      o.suggestions.setAttribute("data-ouvert", "non");
      rendre();
      if (o.surChangement) o.surChangement(liste.slice());
    }

    function marquer(i) {
      var l = o.suggestions.querySelectorAll(".etq-sug");
      if (!l.length) return;
      if (i < 0) i = l.length - 1;
      if (i >= l.length) i = 0;
      l.forEach(function (x) { x.removeAttribute("data-sel"); });
      l[i].setAttribute("data-sel", "oui");
      sel = i;
    }

    function proposer() {
      var q = o.champ.value.trim().toLowerCase();
      o.suggestions.innerHTML = "";
      sel = -1;
      if (!q) { o.suggestions.setAttribute("data-ouvert", "non"); return; }

      var dispo = window.etiquettesExistantes().filter(function (e) {
        return e.nom.indexOf(q) !== -1 && liste.indexOf(e.nom) === -1;
      }).slice(0, 6);
      var exact = dispo.some(function (e) { return e.nom === q; });

      dispo.forEach(function (e) {
        var b = document.createElement("button");
        b.className = "etq-sug"; b.type = "button";
        b.appendChild(document.createTextNode("#" + e.nom));
        var n = document.createElement("span");
        n.className = "etq-sug__n";
        n.textContent = e.n + (e.n > 1 ? " notes" : " note");
        b.appendChild(n);
        b.addEventListener("mousedown", function (ev) { ev.preventDefault(); ajouter(e.nom); o.champ.focus(); });
        o.suggestions.appendChild(b);
      });

      if (!exact) {
        var b2 = document.createElement("button");
        b2.className = "etq-sug"; b2.type = "button";
        b2.appendChild(document.createTextNode("#" + q));
        var n2 = document.createElement("span");
        n2.className = "etq-sug__neuf"; n2.textContent = "créer";
        b2.appendChild(n2);
        b2.addEventListener("mousedown", function (ev) { ev.preventDefault(); ajouter(q); o.champ.focus(); });
        o.suggestions.appendChild(b2);
      }

      o.suggestions.setAttribute("data-ouvert", "oui");
      marquer(0);
    }

    o.champ.addEventListener("input", proposer);
    o.champ.addEventListener("keydown", function (e) {
      var l = o.suggestions.querySelectorAll(".etq-sug");
      if (e.key === "ArrowDown") { e.preventDefault(); marquer(sel + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); marquer(sel - 1); }
      else if (e.key === "Enter") {
        e.preventDefault();
        if (l.length && sel >= 0) l[sel].dispatchEvent(new MouseEvent("mousedown"));
        else ajouter(o.champ.value);
      } else if (e.key === "Escape") { o.suggestions.setAttribute("data-ouvert", "non"); }
      else if (e.key === "Backspace" && !o.champ.value && liste.length) {
        /* Effacement du dernier jeton : le geste attendu dans ce type de champ. */
        liste.pop(); rendre();
        if (o.surChangement) o.surChangement(liste.slice());
      }
    });
    o.champ.addEventListener("blur", function () {
      setTimeout(function () { o.suggestions.setAttribute("data-ouvert", "non"); }, 140);
    });
    o.boite.addEventListener("click", function (e) {
      if (e.target === o.boite) o.champ.focus();
    });

    rendre();

    return {
      valeurs: function () { return liste.slice(); },
      definir: function (v) { liste = (v || []).slice(); rendre(); },
      ajouter: ajouter
    };
  }

  function rendreSommaire() {

      s.appendChild(a);
    });

    /* Le sommaire suit la lecture : sans cela, on perd sa place dans une page
       aussi longue. */
    var observateur = new IntersectionObserver(function (entrees) {
      entrees.forEach(function (e) {
        if (!e.isIntersecting) return;
        s.querySelectorAll("a").forEach(function (a) {
          a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + e.target.id));
        });
      });
    }, { rootMargin: "-80px 0px -70% 0px" });
    document.querySelectorAll(".famille").forEach(function (f) { observateur.observe(f); });
  }

    /* ====================== SYSTÈME DE LECTURE ======================
     Sommaire auto-généré et suivi de lecture, bascule de registre, copie d'un
     bloc de code, agrandissement d'image. Communs à la lecture interne (V-14)
     et publique (V-03).

     Conventions attendues dans le markup :
       #sommaire            liste du sommaire
       #corps-reference     corps du registre Référence
       #corps-operationnel  corps du registre Opérationnel (facultatif)
       #registre            groupe d'onglets, boutons porteurs de data-reg
       .btn-copier          bouton de copie dans un .bloc-code
       .figure__cadre       déclencheur d'agrandissement, #loupe la boîte
     Seuls les niveaux 2 et 3 alimentent le sommaire. */

  /* ---------- Sommaire : construction et suivi de lecture ---------- */
  var somm = document.getElementById("sommaire");
  var observateur = null;

  function corpsCourant() {
    var op = document.getElementById("corps-operationnel");
    return (app.getAttribute("data-registre") === "operationnel" && op)
      ? op : document.getElementById("corps-reference");
  }

  function construireSommaire() {
    if (!somm) return;
    var corps = corpsCourant();
    var titres = corps ? corps.querySelectorAll("h2[id], h3[id]") : [];
    somm.innerHTML = "";
    if (observateur) { observateur.disconnect(); observateur = null; }

    /* Absent si le contenu ne comporte aucun titre. */
    var cadre = somm.closest(".sommaire");
    if (!titres.length) { if (cadre) cadre.hidden = true; return; }
    if (cadre) cadre.hidden = false;

    var numerote = document.body.getAttribute("data-numerote") !== "non";
    var n = 0;
    titres.forEach(function (t) {
      var li = document.createElement("li");
      li.className = t.tagName === "H3" ? "n2" : "n1";
      var a = document.createElement("a");
      a.href = "#" + t.id;
      if (t.tagName === "H2" && numerote) {
        n++;
        var num = document.createElement("span");
        num.className = "sommaire__num";
        num.textContent = String(n).padStart(2, "0");
        a.appendChild(num);
      }
      var lib = document.createElement("span");
      lib.textContent = t.textContent.trim();
      a.appendChild(lib);
      a.addEventListener("click", function (e) {
        e.preventDefault();
        t.scrollIntoView({ behavior: "smooth", block: "start" });
        majAdresse("#" + t.id);
      });
      li.appendChild(a);
      somm.appendChild(li);
    });

    var liens = {};
    somm.querySelectorAll("a").forEach(function (a) { liens[a.getAttribute("href").slice(1)] = a; });
    observateur = new IntersectionObserver(function (entrees) {
      entrees.forEach(function (e) {
        if (e.isIntersecting) {
          somm.querySelectorAll("a").forEach(function (a) { a.removeAttribute("aria-current"); });
          if (liens[e.target.id]) liens[e.target.id].setAttribute("aria-current", "true");
        }
      });
    }, { rootMargin: "-70px 0px -72% 0px", threshold: 0 });
    titres.forEach(function (t) { observateur.observe(t); });
  }
  construireSommaire();

  /* ---------- Bascule de registre ----------
     Sans rechargement, avec recalcul du sommaire. Le registre affiché est
     reflété dans l'adresse : le lien est partageable tel quel. */
  document.querySelectorAll("#registre button").forEach(function (b) {
    b.addEventListener("click", function () {
      var reg = b.getAttribute("data-reg");
      app.setAttribute("data-registre", reg);
      document.querySelectorAll("#registre button").forEach(function (x) {
        x.setAttribute("aria-selected", String(x === b));
      });
      var ref = document.getElementById("corps-reference");
      var op = document.getElementById("corps-operationnel");
      if (ref) ref.hidden = reg !== "reference";
      if (op) op.hidden = reg !== "operationnel";
      majAdresse("?registre=" + reg);
      construireSommaire();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  /* ---------- Copie d'un bloc de code ----------
     La copie produit un texte brut, sans numéro de ligne ni caractère parasite. */
  document.querySelectorAll(".btn-copier").forEach(function (b) {
    b.addEventListener("click", function () {
      var brut = b.closest(".bloc-code").querySelector("code").innerText;
      var fini = function () {
        var av = b.innerHTML;
        b.innerHTML = "Copié";
        setTimeout(function () { b.innerHTML = av; }, 1400);
      };
      if (navigator.clipboard) { navigator.clipboard.writeText(brut).then(fini, fini); } else { fini(); }
    });
  });

  /* ---------- Agrandissement d'image ---------- */
  (function () {
    var loupe = document.getElementById("loupe");
    if (!loupe) return;
    var contenu = document.getElementById("loupe-contenu");
    document.querySelectorAll(".figure__cadre").forEach(function (f) {
      f.addEventListener("click", function () {
        var svg = f.querySelector("svg");
        var img = f.querySelector("img");
        contenu.innerHTML = "";
        if (svg) contenu.innerHTML = svg.outerHTML;
        else if (img) contenu.appendChild(img.cloneNode(true));
        var leg = document.getElementById("loupe-legende");
        var cap = f.closest("figure") && f.closest("figure").querySelector("figcaption");
        if (leg && cap) leg.textContent = cap.textContent.replace(/\s*Cliquez pour agrandir\.?\s*$/, "").trim();
        loupe.showModal();
      });
    });
    var fermer = document.getElementById("loupe-fermer");
    if (fermer) fermer.addEventListener("click", function () { loupe.close(); });
    loupe.addEventListener("click", function (e) { if (e.target === loupe) loupe.close(); });
  })();

    /* ====================== V-09 · PALETTE DE RECHERCHE RAPIDE ====================
     Une fabrique, deux usages : la superposition invoquée au clavier, et des
     aperçus statiques pour la revue des états. Les règles clavier sont celles
     de V-08 — flèches pour parcourir, Entrée pour ouvrir, Échappement pour
     effacer puis quitter, flèche haut depuis le premier résultat pour revenir
     au champ, bouclage après le dernier. */
  (function () {
    var tpl = document.getElementById("tpl-palette");
    if (!tpl) return;

    /* L'état au repos n'est jamais une zone vide : notes récemment consultées. */
    var RECENTES = ["n-restaurer-pg", "n-astreinte", "n-pg-prod-01", "n-diag-barman"];
    var GLYPHES = { "Procédure": "PRO", "Guide": "GUI", "Fiche": "FIC", "Note": "NOT", "Signet": "LIE" };


    /* ---------------------------------------------------------------------
       Fabrique. `hote` reçoit le clone du gabarit.
       Options : statique, requete, degrade, selection, curseur.
       --------------------------------------------------------------------- */
    function creer(hote, opts) {
      opts = opts || {};
      var boite = tpl.content.firstElementChild.cloneNode(true);
      hote.appendChild(boite);

      var saisie = boite.querySelector(".palette__saisie");
      var liste = boite.querySelector(".palette__liste");
      var compteur = boite.querySelector(".palette__compteur");
      var effacer = boite.querySelector(".palette__effacer");
      var btnFermer = boite.querySelector(".palette__fermer");
      var btnTous = boite.querySelector(".palette__tous");

      var sel = -1;
      var resultats = [];
      var declencheur = null;

      if (opts.degrade) boite.setAttribute("data-degrade", "oui");
      if (opts.curseur) boite.setAttribute("data-curseur", "oui");
      if (opts.requete) saisie.value = opts.requete;
      if (opts.statique) {
        /* Un aperçu ne capte ni le focus ni le clavier : il illustre. */
        saisie.setAttribute("tabindex", "-1");
        saisie.setAttribute("readonly", "readonly");
        liste.style.maxHeight = opts.hauteur || "268px";
      }

      function ligne(n, requete, index) {
        var b = document.createElement("a");
        b.className = "pres";
        b.href = "#";
        b.setAttribute("role", "option");
        b.setAttribute("data-index", index);
        b.setAttribute("aria-selected", "false");

        var g = document.createElement("span");
        g.className = "pres__glyphe";
        g.textContent = GLYPHES[n.type] || "NOT";
        b.appendChild(g);

        var corps = document.createElement("span");
        corps.className = "pres__corps";
        var titre = document.createElement("span");
        titre.className = "pres__titre";
        titre.appendChild(window.surligner(n.titre, requete));
        corps.appendChild(titre);

        var sous = document.createElement("span");
        sous.className = "pres__sous";
        sous.appendChild(window.temoinFraicheur(n));
        var meta = document.createElement("span");
        meta.textContent = "· " + n.domaine + " · " + (n.typeFiche ? n.type + " " + n.typeFiche : n.type);
        sous.appendChild(meta);
        if (n.operationnel) {
          var op = document.createElement("span");
          op.className = "past";
          op.style.padding = "1px 5px";
          op.textContent = "Opérationnel";
          sous.appendChild(op);
        }
        corps.appendChild(sous);
        b.appendChild(corps);

        var e = document.createElement("span");
        e.className = "pres__entree";
        e.textContent = "↵";
        b.appendChild(e);

        b.addEventListener("click", function (ev) { ev.preventDefault(); ouvrir(n); });
        if (!opts.statique) {
          b.addEventListener("mousemove", function () { if (sel !== index) marquer(index, false); });
        }
        return b;
      }

      function bloc(texte, requete, actionLabel, action) {
        var d = document.createElement("div");
        d.className = "palette__etat";
        var p = document.createElement("p");
        p.appendChild(document.createTextNode(texte));
        if (requete) {
          var r = document.createElement("span");
          r.className = "palette__requete";
          r.textContent = " « " + requete + " »";
          p.appendChild(r);
        }
        d.appendChild(p);
        if (actionLabel) {
          var b = document.createElement("button");
          b.className = "btn btn--principal";
          b.textContent = actionLabel;
          b.addEventListener("click", action);
          d.appendChild(b);
        }
        return d;
      }

      function rendre() {
        var q = saisie.value.trim();
        liste.innerHTML = "";
        sel = -1;
        effacer.hidden = !q;

        /* Au repos : notes récemment consultées. */
        if (!q) {
          resultats = RECENTES.map(function (id) {
            return window.CORPUS.filter(function (n) { return n.id === id; })[0];
          }).filter(Boolean);
          var t = document.createElement("div");
          t.className = "palette__groupe etiq";
          t.textContent = "Consultées récemment";
          liste.appendChild(t);
          resultats.forEach(function (n, k) { liste.appendChild(ligne(n, "", k)); });
          compteur.textContent = "";
          marquer(opts.selection != null ? opts.selection : 0, false);
          return;
        }

        /* Un seul caractère : invitation à continuer, résultats au deuxième. */
        if (q.length < 2) {
          resultats = [];
          liste.appendChild(bloc("Continuez à taper — les résultats apparaissent dès le deuxième caractère."));
          compteur.textContent = "";
          return;
        }

        var t0 = performance.now();
        resultats = window.chercher(q);
        var duree = Math.max(0.04, (performance.now() - t0) / 1000 + 0.06);

        if (!resultats.length) {
          var d = bloc("Aucun résultat pour", q, "Créer cette note", function () {
            window.notifier && window.notifier("Éditeur ouvert, titre pré-rempli avec « " + q + " » — vue V-17");
          });
          if (window.DROITS_LECTURE) d.querySelector(".btn").remove();
          liste.appendChild(d);
          compteur.textContent = "0 résultat en " + duree.toFixed(2).replace(".", ",") + " s";
          return;
        }

        resultats = resultats.slice(0, 7);
        resultats.forEach(function (n, k) { liste.appendChild(ligne(n, q, k)); });
        compteur.textContent = resultats.length + " résultat" + (resultats.length > 1 ? "s" : "") +
          " en " + duree.toFixed(2).replace(".", ",") + " s";
        marquer(opts.selection != null ? opts.selection : 0, false);
      }

      function marquer(i, defiler) {
        var lignes = liste.querySelectorAll(".pres");
        if (!lignes.length) return;
        if (i < 0) i = lignes.length - 1;
        if (i >= lignes.length) i = 0;
        lignes.forEach(function (l) { l.setAttribute("data-sel", "non"); l.setAttribute("aria-selected", "false"); });
        lignes[i].setAttribute("data-sel", "oui");
        lignes[i].setAttribute("aria-selected", "true");
        if (defiler !== false) lignes[i].scrollIntoView({ block: "nearest" });
        sel = i;
      }

      function ouvrir(n) {
        if (opts.statique) return;
        fermer();
        window.notifier && window.notifier("Ouverture de « " + n.titre + " »" +
          (n.operationnel ? " — directement sur le registre Opérationnel" : ""));
      }

      function ouvrirPalette(dec) {
        var dlg = hote;
        if (dlg.open) { saisie.focus(); saisie.select(); return; }
        declencheur = dec || document.activeElement;
        dlg.showModal();
        rendre();
        saisie.focus();
      }
      function fermer() {
        if (!hote.close || !hote.open) return;
        hote.close();
        if (declencheur && declencheur.focus) declencheur.focus();
      }

      if (!opts.statique) {
        saisie.addEventListener("input", rendre);
        effacer.addEventListener("click", function () { saisie.value = ""; rendre(); saisie.focus(); });
        btnFermer.addEventListener("click", fermer);
        btnTous.addEventListener("click", function () {
          fermer();
          window.notifier && window.notifier("Recherche complète — vue V-08");
        });
        saisie.addEventListener("keydown", function (e) {
          if (e.key === "ArrowDown") { e.preventDefault(); marquer(sel + 1); }
          else if (e.key === "ArrowUp") { e.preventDefault(); marquer(sel - 1); }
          else if (e.key === "Enter") { e.preventDefault(); if (resultats[sel]) ouvrir(resultats[sel]); }
        });
      } else {
        btnTous.setAttribute("tabindex", "-1");
        btnFermer.setAttribute("tabindex", "-1");
      }

      rendre();
      return { boite: boite, rendre: rendre, ouvrir: ouvrirPalette, fermer: fermer, saisie: saisie };
    }
    window.creerPalette = creer;

    /* ---------------------------------------------------------------------
       Instance en superposition
       --------------------------------------------------------------------- */
    var dlg = document.getElementById("palette");
    if (!dlg) return;
    var api = creer(dlg, {});

    window.ouvrirPalette = api.ouvrir;

    /* Échappement : efface d'abord la requête, ne ferme qu'ensuite. */
    dlg.addEventListener("cancel", function (e) {
      e.preventDefault();
      if (api.saisie.value) { api.saisie.value = ""; api.rendre(); api.saisie.focus(); }
      else api.fermer();
    });

    /* Clic hors de la boîte : fermeture. */
    dlg.addEventListener("mousedown", function (e) {
      if (!e.target.closest(".palette__boite")) api.fermer();
    });

    /* Raccourci universel. Un second appui alors que la palette est ouverte
       replace le focus dans le champ sans refermer. */
    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        api.ouvrir();
      }
    });

    var champBarre = document.querySelector(".recherche");
    if (champBarre) {
      champBarre.addEventListener("click", function () { api.ouvrir(champBarre); });
      champBarre.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); api.ouvrir(champBarre); }
      });
    }
  })();

  coquille({ fil: ["Accueil", "Bibliothèque de composants"], courant: [] });
  rendreSommaire();
})();
</script>
