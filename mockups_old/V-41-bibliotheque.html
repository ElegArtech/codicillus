<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliothèque de composants — Codicillus</title>
<link rel="stylesheet" href="polices/polices.css">
<style>/* ==========================================================================
   CODICILLUS — SOCLE
   Jetons et composants communs. Source unique de vérité pour les 41 vues.
   Aucune valeur arbitraire dans les écrans : tout passe par un jeton nommé.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. JETONS
   -------------------------------------------------------------------------- */
:root {
  /* --- Couleur : encres ------------------------------------------------- */
  --c-encre:        #16222b;   /* texte principal */
  --c-encre-2:      #46585f;   /* texte secondaire */
  --c-encre-3:      #536066;   /* texte tertiaire, métadonnées — assombri le
                                  16/08/2026 : #71838a ne donnait que 2,75:1
                                  sur le fond creux, là où RG-M18-07 exige
                                  4,5:1 pour un texte de 11 px. Teinte
                                  conservée, contraste porté à 4,54:1 au pire
                                  des quatre surfaces. */
  --c-encre-4:      #93a2a6;   /* désactivé, placeholder */

  /* --- Couleur : surfaces ----------------------------------------------- */
  --c-fond:         #e2e7e4;   /* fond d'application */
  --c-fond-creux:   #d3d9d6;   /* zones en retrait, rail */
  --c-papier:       #fcfbf8;   /* surface de lecture et cartes */
  --c-papier-2:     #f5f4ef;   /* surface secondaire, en-têtes de tableau */

  /* --- Couleur : traits -------------------------------------------------- */
  --c-trait:        #cbd3d0;   /* bordure standard */
  --c-trait-fin:    #e0e5e2;   /* séparateur discret */
  --c-trait-fort:   #9aa7a3;   /* bordure appuyée */

  /* --- Couleur : accent (violet d'encre) --------------------------------- */
  --c-accent:       #453ba0;
  --c-accent-fonce: #322b78;
  --c-accent-voile: #edecf8;
  --c-accent-trait: #c9c5e8;

  /* --- Couleur : fraîcheur ----------------------------------------------- */
  --c-frais:        #1d6b4a;
  --c-frais-voile:  #e4efe8;
  --c-vieil:        #8f5c00;
  --c-vieil-voile:  #f6eedd;
  --c-obsolete:     #a52c1b;
  --c-obsolete-voile:#f7e7e3;

  /* --- Couleur : sémantique ---------------------------------------------- */
  --c-info:         #1b5c86;
  --c-info-voile:   #e4eef4;
  --c-alerte:       #8f5c00;
  --c-alerte-voile: #f6eedd;
  --c-danger:       #a52c1b;
  --c-danger-voile: #f7e7e3;

  /* --- Typographie : familles -------------------------------------------- */
  --f-ui:      "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-lecture: "Literata", Georgia, "Times New Roman", serif;
  --f-donnee:  "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  /* --- Typographie : échelle --------------------------------------------- */
  --t-micro:  0.6875rem;  /* 11px — étiquettes mono capitales */
  --t-mini:   0.75rem;    /* 12px — métadonnées */
  --t-petit:  0.8125rem;  /* 13px — interface secondaire */
  --t-base:   0.9375rem;  /* 15px — interface */
  --t-lect:   1.0625rem;  /* 17px — corps rédigé */
  --t-t3:     1.125rem;
  --t-t2:     1.375rem;
  --t-t1:     1.75rem;
  --t-titre:  2.125rem;   /* titre de note */

  /* --- Typographie : interlignes et graisses ------------------------------ */
  --i-serre:  1.2;
  --i-ui:     1.45;
  --i-lect:   1.72;
  --g-normal: 400;
  --g-moyen:  500;
  --g-fort:   600;
  --g-lourd:  700;

  /* --- Espacement --------------------------------------------------------- */
  --e-0: 2px;  --e-1: 4px;  --e-2: 8px;  --e-3: 12px;
  --e-4: 16px; --e-5: 24px; --e-6: 32px; --e-7: 48px; --e-8: 64px;

  /* --- Rayons ------------------------------------------------------------- */
  --r-0: 0;    --r-1: 2px;  --r-2: 4px;  --r-3: 8px;

  /* --- Élévations ---------------------------------------------------------- */
  --o-pose:   0 1px 2px rgba(22, 34, 43, .07);
  --o-flotte: 0 6px 20px -4px rgba(22, 34, 43, .18), 0 2px 6px rgba(22, 34, 43, .08);

  /* --- Dimensions de structure --------------------------------------------- */
  --l-rail:     248px;
  --l-sommaire: 204px;
  --l-lecture:  680px;   /* mesure du texte : confort de lecture, non maximisé */
  --l-large:    900px;   /* débord des objets denses : code, tableaux, schémas */
  --l-panneaux: 292px;
  --l-barre:    52px;

  /* --- Mouvement ------------------------------------------------------------ */
  --m-vif:   120ms cubic-bezier(.2,.7,.4,1);
  --m-doux:  240ms cubic-bezier(.2,.7,.4,1);
  --m-ample: 520ms cubic-bezier(.16,.85,.3,1);
}

@media (prefers-reduced-motion: reduce) {
  :root { --m-vif: 1ms; --m-doux: 1ms; --m-ample: 1ms; }
  * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
}

/* --------------------------------------------------------------------------
   2. BASE
   -------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

/* L'attribut hidden doit primer sur toute mise en page en flex ou grid. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--c-fond);
  color: var(--c-encre);
  font-family: var(--f-ui);
  font-size: var(--t-base);
  line-height: var(--i-ui);
  font-weight: var(--g-normal);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
  border-radius: var(--r-1);
}

::selection { background: var(--c-accent-voile); }

.saut-contenu {
  position: absolute; left: var(--e-2); top: -60px; z-index: 200;
  background: var(--c-encre); color: var(--c-papier);
  padding: var(--e-2) var(--e-4); border-radius: var(--r-2);
  text-decoration: none; transition: top var(--m-vif);
}
.saut-contenu:focus { top: var(--e-2); }

.hors-ecran {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* --------------------------------------------------------------------------
   3. ÉTIQUETTE MONO — le label d'instrument, utilisé partout
   -------------------------------------------------------------------------- */
.etiq {
  font-family: var(--f-donnee);
  font-size: var(--t-micro);
  font-weight: var(--g-moyen);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--c-encre-3);
}

/* --------------------------------------------------------------------------
   4. TÉMOIN DE FRAÎCHEUR — la signature du produit
   Jauge à trois barres : 3 pleines = frais, 2 = vieillissant, 1 + hachures =
   obsolète. La forme porte l'information ; la couleur ne fait que la répéter.
   -------------------------------------------------------------------------- */
.temoin {
  display: inline-flex; align-items: center; gap: var(--e-2);
  font-family: var(--f-donnee);
  font-size: var(--t-mini);
  font-weight: var(--g-moyen);
  line-height: 1;
  white-space: nowrap;
}
.temoin__jauge {
  display: inline-flex; align-items: flex-end; gap: 2px; height: 13px;
  flex: none;
}
.temoin__jauge i {
  display: block; width: 4px; border-radius: 1px;
  border: 1px solid currentColor; background: transparent;
}
.temoin__jauge i:nth-child(1) { height: 6px; }
.temoin__jauge i:nth-child(2) { height: 10px; }
.temoin__jauge i:nth-child(3) { height: 13px; }
.temoin__jauge i.plein { background: currentColor; }

.temoin--frais  { color: var(--c-frais); }
.temoin--vieil  { color: var(--c-vieil); }
.temoin--obs    { color: var(--c-obsolete); }

/* Le niveau obsolète porte en plus un hachurage : reconnaissable de loin,
   et lisible en niveaux de gris comme en vision périphérique. */
.temoin--obs .temoin__txt {
  padding: 2px var(--e-2);
  border-radius: var(--r-1);
  background:
    repeating-linear-gradient(135deg,
      var(--c-obsolete-voile) 0 5px,
      #f0d5cf 5px 10px);
  box-shadow: inset 0 0 0 1px #e0b6ad;
}

/* --------------------------------------------------------------------------
   5. BOUTONS
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--e-2);
  font-family: var(--f-ui); font-size: var(--t-petit); font-weight: var(--g-fort);
  line-height: 1; letter-spacing: .005em;
  padding: 9px var(--e-3);
  border: 1px solid var(--c-trait);
  border-radius: var(--r-2);
  background: var(--c-papier);
  color: var(--c-encre);
  cursor: pointer;
  transition: background var(--m-vif), border-color var(--m-vif), color var(--m-vif), transform var(--m-vif);
}
.btn:hover { background: var(--c-papier-2); border-color: var(--c-trait-fort); }
.btn:active { transform: translateY(1px); }

.btn--principal {
  background: var(--c-accent); border-color: var(--c-accent); color: #fff;
}
.btn--principal:hover { background: var(--c-accent-fonce); border-color: var(--c-accent-fonce); }

.btn--discret {
  background: transparent; border-color: transparent; color: var(--c-encre-2);
  font-weight: var(--g-moyen);
}
.btn--discret:hover { background: rgba(22,34,43,.06); color: var(--c-encre); }

.btn--destructif { color: var(--c-danger); }
.btn--destructif:hover { background: var(--c-danger-voile); border-color: #e2b8b0; }

.btn--plein { width: 100%; justify-content: flex-start; }
.btn--menu  { width: 100%; justify-content: flex-start; background: transparent; border-color: transparent; }
.btn--menu:hover { background: rgba(22,34,43,.06); }

.btn svg { flex: none; }

/* --------------------------------------------------------------------------
   6. PASTILLES ET MARQUEURS
   -------------------------------------------------------------------------- */
.past {
  display: inline-flex; align-items: center; gap: var(--e-1);
  font-size: var(--t-mini); font-weight: var(--g-moyen); line-height: 1;
  padding: 4px var(--e-2);
  border: 1px solid var(--c-trait);
  border-radius: var(--r-1);
  background: var(--c-papier-2);
  color: var(--c-encre-2);
  white-space: nowrap;
}
.past--type {
  border-color: var(--c-accent-trait); background: var(--c-accent-voile);
  color: var(--c-accent-fonce); font-weight: var(--g-fort);
}
.past--brouillon {
  border-color: #dcc59a; background: var(--c-alerte-voile); color: var(--c-alerte);
  font-weight: var(--g-fort);
}
.past--etiquette {
  font-family: var(--f-donnee); font-size: var(--t-mini); text-decoration: none;
  background: var(--c-papier); color: var(--c-encre-2);
}
.past--etiquette::before { content: "#"; color: var(--c-encre-4); }
.past--etiquette:hover { border-color: var(--c-accent); color: var(--c-accent); }

/* --------------------------------------------------------------------------
   7. PANNEAU — conteneur de la colonne droite et des blocs de tableau de bord
   -------------------------------------------------------------------------- */
.panneau {
  background: var(--c-papier);
  border: 1px solid var(--c-trait);
  border-radius: var(--r-3);
  box-shadow: var(--o-pose);
}
.panneau__tete {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--e-2);
  padding: var(--e-3) var(--e-4);
  border-bottom: 1px solid var(--c-trait-fin);
}
.panneau__corps { padding: var(--e-3) var(--e-4) var(--e-4); }
.panneau__corps--serre { padding: var(--e-2); }

/* --------------------------------------------------------------------------
   8. ÉTATS DE ZONE — chargement, vide, erreur, sans droit
   -------------------------------------------------------------------------- */
.esquisse {
  background: linear-gradient(90deg, var(--c-fond-creux) 25%, #e6eae7 50%, var(--c-fond-creux) 75%);
  background-size: 240% 100%;
  animation: glisse 1.4s ease-in-out infinite;
  border-radius: var(--r-1);
}
@keyframes glisse { from { background-position: 130% 0; } to { background-position: -30% 0; } }

.zone-etat { padding: var(--e-5) var(--e-4); text-align: center; }
.zone-etat__titre { font-weight: var(--g-fort); font-size: var(--t-petit); margin: 0 0 var(--e-1); }
.zone-etat__txt   { font-size: var(--t-petit); color: var(--c-encre-3); margin: 0 0 var(--e-3); line-height: 1.5; }

/* --------------------------------------------------------------------------
   9. NOTIFICATIONS (V-38)
   Quatre types, quatre comportements. Elles ne bloquent jamais, s'empilent, se
   referment individuellement, et n'occultent ni l'action en cours ni un champ
   de saisie — d'où l'ancrage en bas à droite, à l'écart des colonnes de
   contenu, et le décalage automatique quand une barre d'état occupe ce coin.
   -------------------------------------------------------------------------- */
.notifs {
  position: fixed; z-index: 90; right: var(--e-5); bottom: var(--e-5);
  display: flex; flex-direction: column; gap: var(--e-2); align-items: flex-end;
  max-width: min(400px, calc(100vw - var(--e-5) * 2));
  pointer-events: none;
}
.notifs > * { pointer-events: auto; }

.notif {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  gap: var(--e-1) var(--e-3); align-items: start;
  width: 100%;
  background: var(--c-encre); color: var(--c-papier);
  padding: var(--e-3) var(--e-3) var(--e-3) var(--e-4);
  border-radius: var(--r-3);
  box-shadow: var(--o-flotte);
  font-size: var(--t-petit); font-weight: var(--g-moyen); line-height: 1.45;
  animation: monte var(--m-doux) both;
}
.notif[data-sortie="oui"] { animation: descend var(--m-doux) both; }
@keyframes monte { from { opacity: 0; transform: translateY(10px); } }
@keyframes descend { to { opacity: 0; transform: translateY(6px) scale(.98); } }
@media (prefers-reduced-motion: reduce) {
  .notif, .notif[data-sortie="oui"] { animation: none; }
}

.notif__marque { line-height: 0; margin-top: 1px; }
.notif__corps { min-width: 0; }
.notif__titre { font-weight: var(--g-fort); }
.notif__detail {
  font-size: var(--t-mini); color: rgba(252, 251, 248, .72);
  margin-top: 3px; line-height: 1.45;
}
.notif__actions { grid-column: 2; display: flex; gap: var(--e-2); flex-wrap: wrap; margin-top: var(--e-2); }
.notif__actions button {
  border: 1px solid rgba(252, 251, 248, .3); background: rgba(252, 251, 248, .1);
  color: var(--c-papier); cursor: pointer;
  padding: 4px var(--e-2); border-radius: var(--r-2);
  font-family: var(--f-ui); font-size: var(--t-mini); font-weight: var(--g-fort);
}
.notif__actions button:hover { background: rgba(252, 251, 248, .22); border-color: rgba(252, 251, 248, .5); }
.notif__fermer {
  border: 0; background: none; cursor: pointer; padding: 3px; line-height: 0;
  color: rgba(252, 251, 248, .6); border-radius: var(--r-1);
}
.notif__fermer:hover { background: rgba(252, 251, 248, .16); color: var(--c-papier); }

/* Le type se lit par le glyphe et le filet, jamais par la couleur seule. */
.notif--succes { box-shadow: var(--o-flotte), inset 3px 0 0 #4fbf8b; }
.notif--succes .notif__marque { color: #4fbf8b; }
.notif--erreur { box-shadow: var(--o-flotte), inset 3px 0 0 #e8776a; }
.notif--erreur .notif__marque { color: #e8776a; }
.notif--info { box-shadow: var(--o-flotte), inset 3px 0 0 #7fb3d0; }
.notif--info .notif__marque { color: #7fb3d0; }
.notif--encours { box-shadow: var(--o-flotte), inset 3px 0 0 #9d94e8; }
.notif--encours .notif__marque { color: #9d94e8; }

/* Une opération longue montre son avancement : sans quoi on ne sait pas si
   elle progresse ou si elle est bloquée. */
.notif__progres {
  grid-column: 2; height: 4px; border-radius: 2px;
  background: rgba(252, 251, 248, .18); overflow: hidden; margin-top: var(--e-2);
}
.notif__progres i { display: block; height: 100%; background: #9d94e8; width: 0; transition: width 160ms linear; }

.notif__rouet {
  width: 14px; height: 14px; display: block;
  border: 2px solid rgba(252, 251, 248, .25); border-top-color: #9d94e8;
  border-radius: 50%; animation: tourne-notif .7s linear infinite;
}
@keyframes tourne-notif { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .notifs { right: var(--e-3); left: var(--e-3); bottom: var(--e-3); max-width: none; }
}

/* --------------------------------------------------------------------------
   10. DROITS
   Une action qu'un utilisateur n'a pas le droit d'exécuter n'est pas affichée :
   ni grisée, ni refusée après le clic (RG, §3.5).
   -------------------------------------------------------------------------- */
.app[data-droits="lecture"] .si-ecriture { display: none !important; }
.app:not([data-role="admin"]) .si-admin { display: none !important; }

/* --------------------------------------------------------------------------
   11. CHAMPS DE SAISIE
   Composants de formulaire communs à l'authentification, à l'éditeur, aux
   formulaires de la console et à la bibliothèque de composants (V-41).
   -------------------------------------------------------------------------- */
.champ { display: flex; flex-direction: column; gap: var(--e-1); }
.champ__label {
  font-size: var(--t-petit); font-weight: var(--g-fort); color: var(--c-encre);
}
.champ__label .oblig { color: var(--c-danger); margin-left: 2px; }
.champ__aide { font-size: var(--t-mini); color: var(--c-encre-3); line-height: 1.45; }

.saisie {
  width: 100%;
  padding: 9px var(--e-3);
  border: 1px solid var(--c-trait-fort);
  border-radius: var(--r-2);
  background: var(--c-papier);
  font-family: var(--f-ui); font-size: var(--t-base);
  transition: border-color var(--m-vif), box-shadow var(--m-vif);
}
.saisie::placeholder { color: var(--c-encre-4); }
.saisie:hover { border-color: var(--c-encre-3); }
.saisie:focus { outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-voile); }
.saisie:disabled { background: var(--c-fond-creux); color: var(--c-encre-4); cursor: not-allowed; }
textarea.saisie { resize: vertical; min-height: 84px; line-height: 1.5; }

.champ[data-etat="erreur"] .saisie { border-color: var(--c-danger); }
.champ[data-etat="erreur"] .saisie:focus { box-shadow: 0 0 0 3px var(--c-danger-voile); }
.champ__erreur {
  display: flex; align-items: flex-start; gap: var(--e-1);
  font-size: var(--t-mini); font-weight: var(--g-moyen); color: var(--c-danger);
}

/* Champ avec action attenante — révéler un mot de passe, vider une saisie. */
.champ__boite { position: relative; display: flex; align-items: center; }
.champ__boite .saisie { padding-right: 44px; }
.champ__action {
  position: absolute; right: 5px;
  border: 0; background: none; cursor: pointer; padding: 6px;
  color: var(--c-encre-3); border-radius: var(--r-1); line-height: 0;
}
.champ__action:hover { background: var(--c-fond-creux); color: var(--c-encre); }

/* Case à cocher et interrupteur */
.case {
  display: flex; align-items: flex-start; gap: var(--e-2);
  font-size: var(--t-petit); cursor: pointer;
}
.case input { accent-color: var(--c-accent); margin: 2px 0 0; flex: none; width: 15px; height: 15px; }
.case__txt { line-height: 1.4; }
.case__aide { display: block; font-size: var(--t-mini); color: var(--c-encre-3); margin-top: 2px; }

/* Message d'avertissement lié à la saisie, non bloquant. */
.avis-saisie {
  display: flex; align-items: center; gap: var(--e-2);
  font-size: var(--t-mini); font-weight: var(--g-moyen); color: var(--c-alerte);
}

/* Bouton en attente : le libellé reste lisible, l'action est verrouillée. */
.btn[data-attente="oui"] { pointer-events: none; opacity: .82; }
.rouet {
  width: 13px; height: 13px; flex: none;
  border: 2px solid currentColor; border-right-color: transparent;
  border-radius: 50%; animation: tourne .62s linear infinite;
}
@keyframes tourne { to { transform: rotate(360deg); } }</style>
<style>
/* --- Coquille applicative (V-37) ---------------------------------------- */
.app { display: grid; grid-template-columns: var(--l-rail) minmax(0,1fr); min-height: 100vh; }
/* Le rail escamoté sort de la grille : la colonne de contenu devient la
   seule piste. Déclarer « 0 1fr » laisserait le contenu se placer dans la
   piste de largeur nulle, puisqu'un élément en display:none n'occupe plus
   sa piste. */
.app[data-rail="ferme"] { grid-template-columns: minmax(0,1fr); }
.app[data-rail="ferme"] .rail { display: none; }

.rail {
  background: var(--c-fond-creux);
  border-right: 1px solid var(--c-trait);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.rail__marque {
  display: flex; align-items: center; gap: var(--e-2);
  padding: var(--e-4) var(--e-4) var(--e-3);
}
.rail__nom {
  font-family: var(--f-ui); font-weight: var(--g-lourd); font-size: var(--t-t3);
  letter-spacing: -.02em;
}
.rail__sceau {
  width: 26px; height: 26px; flex: none; border-radius: var(--r-1);
  background: var(--c-accent); color: #fff;
  display: grid; place-items: center;
  font-family: var(--f-donnee); font-size: var(--t-mini); font-weight: var(--g-lourd);
}
.rail__section { padding: var(--e-3) var(--e-2) 0; }
.rail__titre { padding: 0 var(--e-2) var(--e-2); }
.rail__lien {
  display: flex; align-items: center; gap: var(--e-2);
  padding: 6px var(--e-2); border-radius: var(--r-2);
  font-size: var(--t-petit); color: var(--c-encre-2); text-decoration: none;
}
.rail__lien:hover { background: rgba(22,34,43,.06); color: var(--c-encre); }
.rail__lien[aria-current="page"] { background: var(--c-papier); color: var(--c-encre); font-weight: var(--g-fort); box-shadow: var(--o-pose); }

.arbre { list-style: none; margin: 0; padding: 0; }
.arbre ul { list-style: none; margin: 0; padding-left: var(--e-4); border-left: 1px solid var(--c-trait); margin-left: 13px; }
.arbre li { margin: 1px 0; }
.noeud {
  display: flex; align-items: center; gap: 2px;
  border-radius: var(--r-2); padding-right: var(--e-1);
}
.noeud:hover { background: rgba(22,34,43,.06); }
.noeud--courant { background: var(--c-papier); box-shadow: var(--o-pose); }
.noeud__chevron {
  flex: none; width: 20px; height: 24px; padding: 0; border: 0; background: none;
  cursor: pointer; color: var(--c-encre-3); display: grid; place-items: center;
}
.noeud__chevron svg { transition: transform var(--m-vif); }
.noeud[data-ouvert="oui"] > .noeud__chevron svg { transform: rotate(90deg); }
.noeud__nom {
  flex: 1; min-width: 0; padding: 5px 0; font-size: var(--t-petit);
  color: var(--c-encre-2); text-decoration: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.noeud--courant .noeud__nom { color: var(--c-encre); font-weight: var(--g-fort); }
.noeud > ul, .arbre li > ul { display: none; }
.arbre li[data-ouvert="oui"] > ul { display: block; }
.rail__pied {
  margin-top: auto; padding: var(--e-3) var(--e-4);
  border-top: 1px solid var(--c-trait);
}

/* --- Barre supérieure ---------------------------------------------------- */
.cadre { display: flex; flex-direction: column; min-width: 0; }
.barre {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: var(--e-3);
  height: var(--l-barre); padding: 0 var(--e-4);
  background: rgba(226,231,228,.9);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--c-trait);
}
.fil { display: flex; align-items: center; gap: var(--e-1); min-width: 0; flex: 1; font-size: var(--t-petit); }
.fil a { color: var(--c-encre-3); text-decoration: none; white-space: nowrap; }
.fil a:hover { color: var(--c-accent); text-decoration: underline; }
.fil span { color: var(--c-encre-4); }
.fil .fil__courant {
  color: var(--c-encre); font-weight: var(--g-fort);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.recherche {
  display: flex; align-items: center; gap: var(--e-2);
  width: 260px; padding: 6px var(--e-2) 6px var(--e-3);
  background: var(--c-papier); border: 1px solid var(--c-trait); border-radius: var(--r-2);
  color: var(--c-encre-3); font-size: var(--t-petit); cursor: text;
}
.recherche:hover { border-color: var(--c-trait-fort); }
.touche {
  font-family: var(--f-donnee); font-size: var(--t-micro); font-weight: var(--g-moyen);
  padding: 2px 5px; border: 1px solid var(--c-trait); border-bottom-width: 2px;
  border-radius: var(--r-1); background: var(--c-papier-2); color: var(--c-encre-3);
}
.avatar {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: var(--c-accent); color: #fff;
  display: grid; place-items: center;
  font-size: var(--t-mini); font-weight: var(--g-fort);
}

/* --- Menus de la barre (V-37) ------------------------------------------------- */
.menu-barre { position: relative; }
.menu-barre__liste {
  display: none; position: absolute; z-index: 60; top: calc(100% + 6px); left: 0;
  min-width: 216px; padding: var(--e-1);
  background: var(--c-papier); border: 1px solid var(--c-trait-fort);
  border-radius: var(--r-3); box-shadow: var(--o-flotte);
}
.menu-barre__liste--droite { left: auto; right: 0; }
.menu-barre[data-ouvert="oui"] .menu-barre__liste { display: block; }
.menu-barre__liste button {
  display: flex; align-items: center; gap: var(--e-3); width: 100%;
  padding: var(--e-2); border: 0; background: none; cursor: pointer;
  border-radius: var(--r-2); text-align: left;
  font-family: var(--f-ui); font-size: var(--t-petit); color: var(--c-encre);
}
.menu-barre__liste button:hover { background: var(--c-papier-2); }
.menu-barre__liste button svg { flex: none; color: var(--c-encre-3); }
.menu-barre__liste button:hover svg { color: var(--c-accent); }
.menu-barre__entete {
  padding: var(--e-2) var(--e-2) var(--e-3);
  border-bottom: 1px solid var(--c-trait-fin); margin-bottom: var(--e-1);
}
.menu-barre__nom { font-size: var(--t-petit); font-weight: var(--g-fort); }
.menu-barre__role { font-size: var(--t-mini); color: var(--c-encre-3); margin-top: 2px; }
.menu-barre__sep { height: 1px; background: var(--c-trait-fin); margin: var(--e-1) 0; }

/* Chargement local d'une branche : sur la branche, jamais sur l'écran. */
.noeud__rouet {
  width: 11px; height: 11px; flex: none;
  border: 1.5px solid var(--c-trait-fort); border-top-color: var(--c-accent);
  border-radius: 50%; animation: tourne-rail .7s linear infinite;
}
@keyframes tourne-rail { to { transform: rotate(360deg); } }

/* Aucun domaine accessible : un message, jamais une navigation vide. */
.rail__vide {
  margin: var(--e-2); padding: var(--e-3);
  border: 1px dashed var(--c-trait-fort); border-radius: var(--r-2);
  font-size: var(--t-mini); color: var(--c-encre-3); line-height: 1.5;
}

/* ==========================================================================
   SYSTÈME DE LECTURE
   Sommaire, en-tête de note, cartouche de fraîcheur, métadonnées, sélecteur
   de registre et rendu du corps rédigé. Commun à la lecture interne (V-14) et
   à la lecture publique (V-03) : la seconde est une amputation de la première,
   jamais une réécriture.
   ========================================================================== */

/* La colonne d'article est plus large que la mesure du texte : le texte garde
   sa longueur de ligne, tandis que les objets denses — blocs de code, tableaux,
   schémas, alertes — prennent la largeur dont ils ont réellement besoin. Un
   tableau de sauvegardes contraint à 80 caractères n'aide personne. */
.article { min-width: 0; max-width: var(--l-large); }

/* --- Sommaire ------------------------------------------------------------ */
.sommaire { position: sticky; top: calc(var(--l-barre) + var(--e-5)); }
.sommaire__liste { list-style: none; margin: var(--e-2) 0 0; padding: 0; border-left: 2px solid var(--c-trait); }
.sommaire__liste ul { list-style: none; margin: 0; padding: 0; }
.sommaire a {
  display: flex; gap: var(--e-2);
  padding: 5px var(--e-3); margin-left: -2px;
  border-left: 2px solid transparent;
  font-size: var(--t-petit); line-height: 1.35; color: var(--c-encre-3); text-decoration: none;
}
.sommaire a:hover { color: var(--c-encre); }
.sommaire a[aria-current="true"] {
  color: var(--c-accent); font-weight: var(--g-fort); border-left-color: var(--c-accent);
}
.sommaire .n2 a { padding-left: var(--e-6); font-size: var(--t-mini); }
.sommaire__num { font-family: var(--f-donnee); font-size: var(--t-micro); color: var(--c-encre-4); padding-top: 1px; }
.sommaire a[aria-current="true"] .sommaire__num { color: var(--c-accent); }

/* --- En-tête de la note --------------------------------------------------- */
.entete { margin-bottom: var(--e-5); }
.entete__sur { display: flex; align-items: center; gap: var(--e-2); flex-wrap: wrap; margin-bottom: var(--e-3); }
.titre-note {
  font-family: var(--f-ui); font-size: var(--t-titre); font-weight: var(--g-lourd);
  line-height: var(--i-serre); letter-spacing: -.022em;
  margin: 0 0 var(--e-4);
  text-wrap: balance;
}

/* --- CARTOUCHE DE CONTRÔLE : la signature ---------------------------------- */
.cartouche {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--e-4);
  border: 1.5px solid currentColor; border-radius: var(--r-3);
  padding: var(--e-3) var(--e-4);
  margin-bottom: var(--e-4);
}
.cartouche__bloc { display: flex; align-items: center; gap: var(--e-3); min-width: 0; }
.cartouche .temoin__jauge { height: 26px; gap: 3px; }
.cartouche .temoin__jauge i { width: 7px; border-width: 1.5px; border-radius: var(--r-1); }
.cartouche .temoin__jauge i:nth-child(1) { height: 12px; }
.cartouche .temoin__jauge i:nth-child(2) { height: 19px; }
.cartouche .temoin__jauge i:nth-child(3) { height: 26px; }
.cartouche__valeur {
  font-family: var(--f-donnee); font-size: var(--t-t3); font-weight: var(--g-lourd);
  line-height: 1.1; letter-spacing: -.01em;
}
.cartouche__detail { font-size: var(--t-mini); color: var(--c-encre-2); margin-top: 3px; }
.cartouche__detail time { border-bottom: 1px dotted var(--c-encre-4); cursor: help; }
.cartouche__actions { display: flex; gap: var(--e-2); flex: none; }

.cartouche[data-niveau="frais"] { color: var(--c-frais); background: var(--c-frais-voile); }
.cartouche[data-niveau="vieil"] { color: var(--c-vieil); background: var(--c-vieil-voile); }
.cartouche[data-niveau="obs"]   {
  color: var(--c-obsolete);
  background:
    repeating-linear-gradient(135deg,
      var(--c-obsolete-voile) 0 9px, #f2ddd8 9px 18px);
}
.cartouche__valeur, .cartouche__detail strong { color: inherit; }
.cartouche__detail { color: color-mix(in srgb, currentColor 62%, var(--c-encre)); }

.cartouche .btn--verifier {
  border-color: currentColor; color: inherit; background: var(--c-papier);
  font-weight: var(--g-lourd);
}
.cartouche .btn--verifier:hover { background: currentColor; color: var(--c-papier); }

/* Le tampon : retour visuel de la vérification en un clic */
.tampon {
  position: absolute; inset: 0; display: grid; place-items: center;
  pointer-events: none; opacity: 0;
}
.tampon span {
  font-family: var(--f-donnee); font-weight: var(--g-lourd); font-size: 1.5rem;
  letter-spacing: .18em; color: var(--c-frais);
  border: 3px solid var(--c-frais); border-radius: var(--r-2);
  padding: var(--e-2) var(--e-4);
  transform: rotate(-7deg);
  background: rgba(252,251,248,.82);
}
.cartouche.tamponne .tampon { animation: tamponner var(--m-ample) both; }
@keyframes tamponner {
  0%   { opacity: 0; transform: scale(1.9); }
  35%  { opacity: 1; transform: scale(1); }
  75%  { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1); }
}
.cartouche.tamponne .temoin__jauge i { animation: remplir var(--m-doux) both; }
.cartouche.tamponne .temoin__jauge i:nth-child(2) { animation-delay: 90ms; }
.cartouche.tamponne .temoin__jauge i:nth-child(3) { animation-delay: 180ms; }
@keyframes remplir { from { transform: scaleY(.2); opacity: .3; } }

/* --- Métadonnées ---------------------------------------------------------- */
.meta {
  display: grid; grid-template-columns: auto 1fr; gap: var(--e-2) var(--e-4);
  font-size: var(--t-petit);
  padding: var(--e-3) 0; border-top: 1px solid var(--c-trait-fin); border-bottom: 1px solid var(--c-trait-fin);
}
.meta dt { color: var(--c-encre-3); font-size: var(--t-mini); padding-top: 2px; }
.meta dd { margin: 0; display: flex; align-items: center; gap: var(--e-2); flex-wrap: wrap; }
.meta a { color: var(--c-encre); text-decoration: none; border-bottom: 1px solid var(--c-trait-fort); }
.meta a:hover { color: var(--c-accent); border-color: var(--c-accent); }
.chiffre { font-family: var(--f-donnee); font-size: var(--t-mini); color: var(--c-encre-2); }

/* --- Sélecteur de registre ------------------------------------------------- */
.registre {
  display: flex; align-items: center; gap: var(--e-2);
  margin: var(--e-5) 0 var(--e-6);
  padding: var(--e-1);
  background: var(--c-fond-creux); border: 1px solid var(--c-trait);
  border-radius: var(--r-3); width: fit-content;
}
.registre button {
  border: 0; background: transparent; cursor: pointer;
  padding: 7px var(--e-4); border-radius: var(--r-2);
  font-size: var(--t-petit); font-weight: var(--g-fort); color: var(--c-encre-2);
  display: flex; align-items: center; gap: var(--e-2);
}
.registre button[aria-selected="true"] {
  background: var(--c-papier); color: var(--c-encre); box-shadow: var(--o-pose);
}
.registre__pt { width: 6px; height: 6px; border-radius: 50%; background: var(--c-encre-4); }
.registre button[aria-selected="true"] .registre__pt { background: var(--c-accent); }
.invite-op {
  display: inline-flex; align-items: center; gap: var(--e-2);
  margin: var(--e-5) 0 var(--e-6);
  font-size: var(--t-petit); color: var(--c-encre-3);
  border: 1px dashed var(--c-trait-fort); border-radius: var(--r-2);
  padding: var(--e-2) var(--e-3); background: none; cursor: pointer;
}
.invite-op:hover { color: var(--c-accent); border-color: var(--c-accent); }

/* --- Corps rédigé --------------------------------------------------------- */
.prose {
  font-family: var(--f-lecture); font-size: var(--t-lect);
  line-height: var(--i-lect); color: var(--c-encre);
  counter-reset: sec;
}
.prose > * + * { margin-top: var(--e-4); }
.prose p { margin: 0; }

/* Mesure du texte courant. */
.prose > * { max-width: var(--l-lecture); }
/* Débordent de la mesure : ce qui se balaie plutôt que ce qui se lit. */
.prose > .bloc-code,
.prose > .tableau-boite,
.prose > .figure,
.prose > .alerte { max-width: none; }

.prose h2 {
  counter-increment: sec;
  font-family: var(--f-ui); font-size: var(--t-t1); font-weight: var(--g-lourd);
  line-height: 1.25; letter-spacing: -.018em;
  margin: var(--e-7) 0 var(--e-4);
  padding-top: var(--e-3); border-top: 1px solid var(--c-trait);
  display: flex; gap: var(--e-3); align-items: baseline;
  scroll-margin-top: calc(var(--l-barre) + var(--e-4));
}
/* La numérotation n'est pas décorative : le type de note est « Procédure »,
   l'ordre des sections porte l'ordre des opérations. */
.prose h2::before {
  content: counter(sec, decimal-leading-zero);
  font-family: var(--f-donnee); font-size: var(--t-base); font-weight: var(--g-moyen);
  color: var(--c-accent); flex: none;
}
.prose h3 {
  font-family: var(--f-ui); font-size: var(--t-t2); font-weight: var(--g-fort);
  line-height: 1.3; letter-spacing: -.012em; margin: var(--e-6) 0 var(--e-3);
  scroll-margin-top: calc(var(--l-barre) + var(--e-4));
}
.prose h4 { font-family: var(--f-ui); font-size: var(--t-t3); font-weight: var(--g-fort); margin: var(--e-5) 0 var(--e-2); }
.prose h5 { font-family: var(--f-ui); font-size: var(--t-base); font-weight: var(--g-fort); margin: var(--e-4) 0 var(--e-2); }
.prose h6 {
  font-family: var(--f-donnee); font-size: var(--t-mini); font-weight: var(--g-fort);
  text-transform: uppercase; letter-spacing: .09em; color: var(--c-encre-2);
  margin: var(--e-4) 0 var(--e-2);
}
.prose strong { font-weight: var(--g-fort); }
.prose em { font-style: italic; }
.prose u { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.prose s { color: var(--c-encre-3); }
.prose mark { background: #f6e9a8; color: var(--c-encre); padding: 0 3px; border-radius: var(--r-1); }

.prose ul, .prose ol { margin: 0; padding-left: var(--e-5); }
.prose li + li { margin-top: var(--e-2); }
.prose li > ul, .prose li > ol { margin-top: var(--e-2); }
.prose ul { list-style: none; padding-left: var(--e-5); }
.prose ul > li { position: relative; }
.prose ul > li::before {
  content: ""; position: absolute; left: calc(var(--e-5) * -1 + 6px); top: .62em;
  width: 5px; height: 5px; background: var(--c-encre-4); border-radius: var(--r-1);
}
.prose ul ul > li::before { background: none; box-shadow: inset 0 0 0 1px var(--c-encre-4); }
.prose ol { list-style: none; counter-reset: pas; padding-left: var(--e-6); }
.prose ol > li { position: relative; counter-increment: pas; }
.prose ol > li::before {
  content: counter(pas) "."; position: absolute; left: calc(var(--e-6) * -1); top: .1em;
  font-family: var(--f-donnee); font-size: var(--t-petit); color: var(--c-accent); font-weight: var(--g-moyen);
}

.prose .taches { list-style: none; padding-left: 0; }
.taches li { display: flex; gap: var(--e-3); align-items: flex-start; }
.taches li::before { display: none; }
.taches input { margin: .38em 0 0; accent-color: var(--c-accent); flex: none; }
.taches input:disabled { opacity: 1; }
.taches li:has(input:checked) { color: var(--c-encre-3); }

.prose code {
  font-family: var(--f-donnee); font-size: .84em;
  background: var(--c-papier-2); border: 1px solid var(--c-trait-fin);
  border-radius: var(--r-1); padding: 1px 5px; white-space: nowrap;
}
.bloc-code {
  border: 1px solid var(--c-trait); border-radius: var(--r-3); overflow: hidden;
  background: var(--c-papier-2);
}
.bloc-code__tete {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--e-2) var(--e-2) var(--e-2) var(--e-4);
  border-bottom: 1px solid var(--c-trait-fin); background: var(--c-papier);
}
.bloc-code pre {
  margin: 0; padding: var(--e-4); overflow-x: auto;
  font-family: var(--f-donnee); font-size: var(--t-petit); line-height: 1.7;
}
.bloc-code code { background: none; border: 0; padding: 0; font-size: inherit; white-space: pre; }
.j-cmd { color: var(--c-accent-fonce); font-weight: var(--g-moyen); }
.j-arg { color: var(--c-info); }
.j-str { color: var(--c-frais); }
.j-com { color: var(--c-encre-4); font-style: italic; }
.j-mot { color: #7a2f8f; font-weight: var(--g-moyen); }

blockquote.prose-cit {
  margin: 0; padding: var(--e-1) 0 var(--e-1) var(--e-4);
  border-left: 3px solid var(--c-accent-trait);
  color: var(--c-encre-2); font-style: italic;
}
blockquote.prose-cit footer { font-style: normal; font-size: var(--t-petit); color: var(--c-encre-3); margin-top: var(--e-2); }

.alerte {
  display: flex; gap: var(--e-3);
  border: 1px solid var(--c-trait); border-left-width: 4px;
  border-radius: var(--r-3); padding: var(--e-3) var(--e-4);
  font-size: var(--t-petit); font-family: var(--f-ui); line-height: 1.55;
}
.alerte__tete { display: flex; align-items: center; gap: var(--e-2); font-weight: var(--g-lourd); margin-bottom: var(--e-1); }
.alerte__glyphe {
  font-family: var(--f-donnee); font-size: var(--t-micro); font-weight: var(--g-lourd);
  letter-spacing: .08em; padding: 2px 6px; border-radius: var(--r-1); color: #fff;
}
.alerte--astuce  { background: var(--c-accent-voile); border-color: var(--c-accent-trait); border-left-color: var(--c-accent); }
.alerte--astuce .alerte__glyphe { background: var(--c-accent); }
.alerte--attention { background: var(--c-alerte-voile); border-color: #dcc59a; border-left-color: var(--c-alerte); }
.alerte--attention .alerte__glyphe { background: var(--c-alerte); }
.alerte--danger { background: var(--c-danger-voile); border-color: #e2b8b0; border-left-color: var(--c-danger); }
.alerte--danger .alerte__glyphe { background: var(--c-danger); }
.alerte--danger .alerte__tete { text-transform: uppercase; letter-spacing: .04em; }

.tableau-boite { overflow-x: auto; border: 1px solid var(--c-trait); border-radius: var(--r-3); }
.prose table { border-collapse: collapse; width: 100%; font-family: var(--f-ui); font-size: var(--t-petit); }
.prose th, .prose td { text-align: left; padding: var(--e-2) var(--e-3); border-bottom: 1px solid var(--c-trait-fin); white-space: nowrap; }
.prose thead th { background: var(--c-papier-2); font-weight: var(--g-fort); font-size: var(--t-mini); color: var(--c-encre-2); }
.prose tbody tr:last-child td { border-bottom: 0; }
.prose td.num { font-family: var(--f-donnee); }

.figure { margin: 0; }
.figure__cadre {
  border: 1px solid var(--c-trait); border-radius: var(--r-3); background: var(--c-papier-2);
  padding: var(--e-4); cursor: zoom-in; display: block; width: 100%; text-align: left;
}
.figure__cadre:hover { border-color: var(--c-trait-fort); }
.figure figcaption {
  font-family: var(--f-ui); font-size: var(--t-mini); color: var(--c-encre-3);
  margin-top: var(--e-2); display: flex; gap: var(--e-2);
}
.figure figcaption b { color: var(--c-encre-2); font-weight: var(--g-fort); }

.prose hr { border: 0; border-top: 1px solid var(--c-trait); margin: var(--e-6) 0; }

.lien-int {
  color: var(--c-accent-fonce); text-decoration: none;
  border-bottom: 1px solid var(--c-accent-trait);
  padding-bottom: 1px;
}
.lien-int:hover { border-bottom-color: var(--c-accent); background: var(--c-accent-voile); }
.lien-casse {
  color: var(--c-obsolete); text-decoration: none;
  border-bottom: 1px dashed var(--c-obsolete);
  background: var(--c-obsolete-voile); padding: 0 3px; cursor: pointer;
}
.lien-casse::after { content: " ⊘"; font-size: .8em; }
.lien-ext { color: var(--c-encre); text-decoration: underline; text-decoration-color: var(--c-trait-fort); text-underline-offset: 3px; }
.lien-ext::after { content: " ↗"; font-size: .8em; color: var(--c-encre-3); }

/* --- Agrandissement d'image -------------------------------------------------- */
.loupe {
  position: fixed; inset: 0; z-index: 100; border: 0; padding: var(--e-6);
  background: rgba(22,34,43,.72); display: none; place-items: center;
}
.loupe[open] { display: grid; }
.loupe__boite { background: var(--c-papier); border-radius: var(--r-3); padding: var(--e-5); max-width: min(1000px, 92vw); box-shadow: var(--o-flotte); }
.loupe__boite svg { width: 100%; height: auto; }
.loupe__pied { display: flex; justify-content: space-between; align-items: center; gap: var(--e-4); margin-top: var(--e-3); font-size: var(--t-mini); color: var(--c-encre-3); }

/* --- Numérotation des sections -------------------------------------------
   Elle n'est pas décorative : elle n'a de sens que si l'ordre des sections
   porte l'ordre des opérations. Une note de type Procédure la porte, un Guide
   ou une Note ne la portent pas. */
body[data-numerote="non"] .prose h2::before { content: none; }
body[data-numerote="non"] .prose h2 { gap: 0; }

/* ==========================================================================
   CARTE DE RÉSULTAT
   Composant commun à la recherche interne (V-08) et publique (V-02). La
   variante publique retire ce qui n'a pas de sens sans compte ; elle ne
   redéfinit rien, elle masque.
   ========================================================================== */

.resultats { display: flex; flex-direction: column; gap: var(--e-2); }

.carte {
  display: block; width: 100%; text-align: left;
  background: var(--c-papier);
  border: 1px solid var(--c-trait); border-radius: var(--r-3);
  padding: var(--e-4);
  cursor: pointer; font-family: inherit; color: inherit;
  box-shadow: var(--o-pose);
  transition: border-color var(--m-vif), background var(--m-vif);
}
.carte:hover { background: var(--c-papier-2); border-color: var(--c-trait-fort); }
/* Sélection clavier : nettement distincte du survol souris. */
.carte[data-sel="oui"] {
  background: var(--c-papier);
  border-color: var(--c-accent);
  box-shadow: inset 4px 0 0 var(--c-accent), 0 0 0 3px var(--c-accent-voile);
}

.carte__haut { display: flex; align-items: flex-start; gap: var(--e-3); margin-bottom: var(--e-2); }
.carte__titre {
  font-family: var(--f-ui); font-size: var(--t-t3); font-weight: var(--g-fort);
  line-height: 1.3; letter-spacing: -.012em; margin: 0; flex: 1; min-width: 0;
}
.carte__titre mark { background: #f6e9a8; color: inherit; padding: 0 2px; border-radius: var(--r-1); }
.carte[data-sel="oui"] .carte__titre { color: var(--c-accent-fonce); }

.carte__extrait {
  font-family: var(--f-lecture); font-size: var(--t-petit); line-height: 1.6;
  color: var(--c-encre-2); margin: 0 0 var(--e-3);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.carte__extrait mark { background: #f6e9a8; color: var(--c-encre); padding: 0 2px; border-radius: var(--r-1); }

.carte__signal {
  display: flex; align-items: center; gap: var(--e-3); flex-wrap: wrap;
  padding: var(--e-2) 0; margin-bottom: var(--e-2);
  border-top: 1px solid var(--c-trait-fin); border-bottom: 1px solid var(--c-trait-fin);
}
.carte__revision { font-family: var(--f-donnee); font-size: var(--t-mini); color: var(--c-encre-2); }
.carte__revision[data-jamais="oui"] {
  color: var(--c-obsolete); font-weight: var(--g-moyen);
  border-bottom: 1px dashed currentColor;
}

.carte__pied {
  display: flex; align-items: center; gap: var(--e-2) var(--e-3); flex-wrap: wrap;
  font-size: var(--t-mini); color: var(--c-encre-3);
}
.carte__pied .sep { color: var(--c-trait-fort); }
.carte__chemin { color: var(--c-encre-2); }
.carte__chemin b { font-weight: var(--g-fort); color: var(--c-encre); }
.marque-op {
  display: inline-flex; align-items: center; gap: var(--e-1);
  font-size: var(--t-mini); font-weight: var(--g-fort);
  padding: 3px var(--e-2); border-radius: var(--r-1);
  background: var(--c-accent-voile); color: var(--c-accent-fonce);
  border: 1px solid var(--c-accent-trait);
}
.marque-signet {
  display: inline-flex; align-items: center; gap: var(--e-1);
  font-family: var(--f-donnee); font-size: var(--t-mini); color: var(--c-info);
}

/* --- Variante publique ---------------------------------------------------
   Ni statut de brouillon, ni visibilité, ni marquage de registre interne. */
.carte--publique .past--brouillon,
.carte--publique .carte__visibilite { display: none; }

/* ==========================================================================
   BARRE DE RÉPARTITION DE FRAÎCHEUR
   Commune au tableau de bord (V-07), aux pages d'univers et de domaine
   (V-10, V-11) et aux listes (V-12).

   Les trois parts se distinguent par leur remplissage autant que par leur
   teinte — plein, rayé fin, hachuré large — de sorte que la répartition reste
   lisible sans la couleur, en niveaux de gris comme en vision périphérique.
   Le hachurage de la part obsolète reprend celui du témoin de fraîcheur.
   ========================================================================== */

.repart { display: flex; height: 14px; border-radius: var(--r-1); overflow: hidden; border: 1px solid var(--c-trait); }
.repart button { border: 0; padding: 0; cursor: pointer; transition: filter var(--m-vif); }
.repart button:hover { filter: brightness(.9); }
.repart button + button { border-left: 1px solid var(--c-papier); }
.repart .p-frais { background: var(--c-frais); }
.repart .p-vieil {
  background: repeating-linear-gradient(90deg, var(--c-vieil) 0 2px, #c99a3d 2px 5px);
}
.repart .p-obs {
  background: repeating-linear-gradient(135deg, var(--c-obsolete) 0 4px, #d1705f 4px 8px);
}
.legende { display: flex; gap: var(--e-3); flex-wrap: wrap; margin-top: var(--e-2); }
.legende span { display: inline-flex; align-items: center; gap: var(--e-1); font-size: var(--t-mini); color: var(--c-encre-2); }
.legende i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.legende .p-frais { background: var(--c-frais); }
.legende .p-vieil { background: repeating-linear-gradient(90deg, var(--c-vieil) 0 2px, #c99a3d 2px 5px); }
.legende .p-obs { background: repeating-linear-gradient(135deg, var(--c-obsolete) 0 3px, #d1705f 3px 6px); }
.legende b { font-family: var(--f-donnee); font-weight: var(--g-lourd); }

/* ==========================================================================
   SQUELETTES DE CHARGEMENT (V-39)
   Une esquisse de la structure finale, pas un indicateur générique. Ce qui
   apparaît doit permettre de deviner ce qui arrive : une carte de résultat,
   une ligne de liste, un graphe. Le rouet universel ne dit rien.

   Le battement est lent et de faible amplitude : un clignotement rapide sur
   toute la page fatigue et donne une fausse impression de lenteur.
   ========================================================================== */
.sq {
  background: var(--c-fond-creux);
  border-radius: var(--r-1);
  animation: battement 1.6s ease-in-out infinite;
}
.sq--fort { background: var(--c-trait); }
@keyframes battement { 50% { opacity: .48; } }
@media (prefers-reduced-motion: reduce) {
  .sq { animation: none; opacity: .72; }
}

.sq-l { height: 11px; }
.sq-l--titre { height: 17px; border-radius: 3px; }
.sq-pile { display: flex; flex-direction: column; gap: 7px; }

/* Carte de résultat de recherche */
.sq-carte {
  border: 1px solid var(--c-trait); border-radius: var(--r-3);
  background: var(--c-papier); padding: var(--e-4);
  display: flex; flex-direction: column; gap: var(--e-3);
}
.sq-carte__tete { display: flex; align-items: center; gap: var(--e-3); }
.sq-carte__pieds { display: flex; gap: var(--e-2); }

/* Ligne de liste */
.sq-liste { border: 1px solid var(--c-trait); border-radius: var(--r-3); background: var(--c-papier); overflow: hidden; }
.sq-ligne { display: flex; align-items: center; gap: var(--e-3); padding: var(--e-3) var(--e-4); }
.sq-ligne + .sq-ligne { border-top: 1px solid var(--c-trait-fin); }

/* Panneau latéral */
.sq-panneau {
  border: 1px solid var(--c-trait); border-radius: var(--r-3);
  background: var(--c-papier); overflow: hidden;
}
.sq-panneau__tete { padding: var(--e-3) var(--e-4); border-bottom: 1px solid var(--c-trait-fin); background: var(--c-papier-2); }
.sq-panneau__corps { padding: var(--e-4); display: flex; flex-direction: column; gap: var(--e-3); }

/* Tableau de bord */
.sq-bord { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--e-3); }
.sq-mesure { border: 1px solid var(--c-trait); border-radius: var(--r-3); background: var(--c-papier); padding: var(--e-4); }

/* Graphe : les nœuds apparaissent à leur place approximative, ce qui annonce
   la forme du résultat plutôt qu'un rectangle gris. */
.sq-graphe {
  position: relative; height: 208px;
  border: 1px solid var(--c-trait); border-radius: var(--r-3);
  background: var(--c-fond); overflow: hidden;
}
.sq-noeud { position: absolute; border-radius: 50%; background: var(--c-trait); animation: battement 1.6s ease-in-out infinite; }
.sq-arete { position: absolute; height: 1.5px; background: var(--c-trait); transform-origin: 0 50%; animation: battement 1.6s ease-in-out infinite; }

/* Arborescence */
.sq-arbre { display: flex; flex-direction: column; gap: 9px; }
.sq-branche { display: flex; align-items: center; gap: var(--e-2); }

/* ==========================================================================
   BOÎTES DE DIALOGUE
   Ossature commune. Toute superposition piège le focus, se ferme à
   l'échappement et rend le focus à son déclencheur — le comportement natif de
   <dialog> s'en charge, il ne faut pas le contourner.

   Les actions irréversibles suivent un gabarit strict : rappel de ce qui sera
   détruit, décompte chiffré, et pour les suppressions structurantes saisie du
   nom exact avant que la confirmation ne devienne active.
   ========================================================================== */
.dlg {
  border: 0; padding: 0; margin: 0; max-width: none; max-height: none;
  width: 100%; height: 100%; background: transparent; display: none;
}
.dlg[open] { display: block; }
.dlg::backdrop { background: rgba(22, 34, 43, .5); backdrop-filter: blur(2px); }

.dlg__boite {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(500px, calc(100vw - 32px));
  max-height: min(84vh, 720px);
  display: flex; flex-direction: column;
  background: var(--c-papier);
  border: 1px solid var(--c-trait-fort);
  border-radius: var(--r-3);
  box-shadow: var(--o-flotte);
  overflow: hidden;
  animation: dlg-entre var(--m-doux) both;
}
.dlg--large .dlg__boite { width: min(620px, calc(100vw - 32px)); }
@keyframes dlg-entre { from { opacity: 0; transform: translate(-50%, calc(-50% + 8px)); } }

.dlg__tete {
  display: flex; align-items: flex-start; gap: var(--e-3);
  padding: var(--e-4) var(--e-5) var(--e-3);
  flex: none;
}
.dlg__marque {
  flex: none; width: 30px; height: 30px; border-radius: var(--r-2);
  display: grid; place-items: center; color: #fff;
  background: var(--c-accent);
}
.dlg--destructif .dlg__marque { background: var(--c-danger); }
.dlg__titre {
  font-family: var(--f-ui); font-size: var(--t-t3); font-weight: var(--g-lourd);
  letter-spacing: -.014em; margin: 3px 0 0; flex: 1; min-width: 0;
}
.dlg__fermer {
  flex: none; border: 0; background: none; cursor: pointer; padding: 5px; line-height: 0;
  color: var(--c-encre-3); border-radius: var(--r-1);
}
.dlg__fermer:hover { background: var(--c-fond-creux); color: var(--c-encre); }

.dlg__corps {
  padding: 0 var(--e-5) var(--e-4);
  overflow-y: auto; flex: 1; min-height: 0;
  display: flex; flex-direction: column; gap: var(--e-4);
}
.dlg__texte { font-size: var(--t-petit); color: var(--c-encre-2); line-height: 1.6; margin: 0; }
.dlg__texte strong { color: var(--c-encre); }

.dlg__pied {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--e-2);
  padding: var(--e-3) var(--e-5) var(--e-4);
  border-top: 1px solid var(--c-trait-fin);
  background: var(--c-papier-2);
  flex: none;
}
.dlg__pied--reparti { justify-content: space-between; }

/* --- Décompte de ce qui sera détruit ---------------------------------------
   Chiffré, jamais approximatif. C'est ce décompte qui permet à l'utilisateur
   de mesurer la portée réelle de son geste. */
.decompte {
  border: 1px solid #e2b8b0; border-left: 4px solid var(--c-danger);
  border-radius: var(--r-3);
  background: var(--c-danger-voile);
  padding: var(--e-3) var(--e-4);
}
.decompte__titre {
  font-size: var(--t-petit); font-weight: var(--g-fort); color: var(--c-danger);
  margin-bottom: var(--e-2);
}
.decompte ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--e-1); }
.decompte li { display: flex; align-items: baseline; gap: var(--e-2); font-size: var(--t-petit); color: var(--c-encre); }
.decompte li b { font-family: var(--f-donnee); font-weight: var(--g-lourd); min-width: 2.2em; }
.decompte__note { font-size: var(--t-mini); color: var(--c-encre-2); margin-top: var(--e-2); }

/* --- Confirmation par saisie du nom exact ------------------------------------- */
.confirmation__cible {
  font-family: var(--f-donnee); font-size: var(--t-petit); font-weight: var(--g-lourd);
  padding: 2px var(--e-2); border-radius: var(--r-1);
  background: var(--c-papier-2); border: 1px solid var(--c-trait);
  user-select: all;
}

/* --- Sélecteur arborescent de destination -------------------------------------- */
.arbre-choix {
  border: 1px solid var(--c-trait); border-radius: var(--r-2);
  background: var(--c-papier-2);
  max-height: 232px; overflow-y: auto;
  padding: var(--e-2);
}
.arbre-choix ul { list-style: none; margin: 0; padding: 0 0 0 var(--e-4); }
.arbre-choix > ul { padding-left: 0; }
.choix {
  display: flex; align-items: flex-start; gap: var(--e-2);
  padding: 5px var(--e-2); border-radius: var(--r-2);
  font-size: var(--t-petit); cursor: pointer;
}
.choix:hover { background: var(--c-papier); }
.choix input { accent-color: var(--c-accent); margin: 3px 0 0; flex: none; }
.choix__corps { flex: 1; min-width: 0; }
.choix__nom { display: block; }
/* Un refus est expliqué à l'endroit du refus, jamais après le clic. */
.choix[data-refuse="oui"] { cursor: not-allowed; }
.choix[data-refuse="oui"] .choix__nom { color: var(--c-encre-4); text-decoration: line-through; }
.choix__motif {
  display: block; font-size: var(--t-mini); color: var(--c-danger);
  margin-top: 2px; line-height: 1.4;
}

@media (max-width: 520px) {
  .dlg__boite { top: auto; bottom: 0; left: 0; transform: none; width: 100vw; border-radius: var(--r-3) var(--r-3) 0 0; max-height: 92vh; }
  @keyframes dlg-entre { from { opacity: 0; transform: translateY(16px); } }
  .dlg__pied { flex-direction: column-reverse; align-items: stretch; }
  .dlg__pied .btn { width: 100%; justify-content: center; }
}

/* ==========================================================================
   SAISIE D'ÉTIQUETTES
   Composant commun à l'éditeur de note (V-17) et au formulaire de signet
   (V-23). Auto-complétion sur l'existant, création explicite à la volée.
   ========================================================================== */

.etq-boite {
  display: flex; flex-wrap: wrap; gap: var(--e-1); align-items: center;
  padding: 5px var(--e-2);
  border: 1px solid var(--c-trait-fort); border-radius: var(--r-2);
  background: var(--c-papier); min-height: 38px;
}
.etq-boite:focus-within { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-voile); }
.etq {
  display: inline-flex; align-items: center; gap: var(--e-1);
  padding: 2px var(--e-1) 2px var(--e-2); border-radius: var(--r-1);
  background: var(--c-papier-2); border: 1px solid var(--c-trait);
  font-family: var(--f-donnee); font-size: var(--t-mini);
}
.etq::before { content: "#"; color: var(--c-encre-4); }
.etq button { border: 0; background: none; cursor: pointer; padding: 1px; line-height: 0; color: var(--c-encre-3); border-radius: 2px; }
.etq button:hover { background: var(--c-danger-voile); color: var(--c-danger); }
.etq-boite input {
  flex: 1; min-width: 88px; border: 0; outline: none; background: none;
  font-family: var(--f-ui); font-size: var(--t-petit); padding: 3px 0;
}
.etq-suggestions {
  display: none; position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 4px);
  max-height: 188px; overflow-y: auto; padding: var(--e-1);
  background: var(--c-papier); border: 1px solid var(--c-trait-fort);
  border-radius: var(--r-2); box-shadow: var(--o-flotte);
}
.etq-suggestions[data-ouvert="oui"] { display: block; }
.etq-sug {
  display: flex; align-items: center; gap: var(--e-2); width: 100%;
  padding: 5px var(--e-2); border: 0; background: none; cursor: pointer;
  border-radius: var(--r-2); text-align: left; font-family: var(--f-donnee); font-size: var(--t-petit);
}
.etq-sug:hover, .etq-sug[data-sel="oui"] { background: var(--c-accent-voile); }
.etq-sug__n { margin-left: auto; font-size: var(--t-micro); color: var(--c-encre-3); }
.etq-sug__neuf { margin-left: auto; font-size: var(--t-micro); color: var(--c-accent); font-family: var(--f-ui); font-weight: var(--g-fort); }

/* ==========================================================================
   V-09 — PALETTE DE RECHERCHE RAPIDE
   Superposition invoquée au clavier depuis n'importe quelle vue.
   Piège le focus, se ferme à l'échappement, rend le focus à son déclencheur.

   La boîte est instanciable hors superposition — c'est ce qui permet d'en
   présenter tous les états côte à côte sans dupliquer le composant.
   ========================================================================== */

/* --- Superposition ------------------------------------------------------- */
.palette {
  border: 0; padding: 0; margin: 0; max-width: none; max-height: none;
  width: 100%; height: 100%; background: transparent; display: none;
}
.palette[open] { display: block; }
.palette::backdrop { background: rgba(22, 34, 43, .46); backdrop-filter: blur(2px); }

.palette[open] .palette__boite {
  position: fixed; top: 11vh; left: 50%; transform: translateX(-50%);
  width: min(660px, calc(100vw - 32px));
  max-height: 74vh;
  animation: palette-entre var(--m-doux) both;
}
@keyframes palette-entre { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } }

/* --- La boîte ------------------------------------------------------------- */
.palette__boite {
  background: var(--c-papier);
  border: 1px solid var(--c-trait-fort);
  border-radius: var(--r-3);
  box-shadow: var(--o-flotte);
  overflow: hidden;
  display: flex; flex-direction: column;
}

/* Hôte d'un aperçu statique : sert de conteneur de requête, pour que les
   règles de petit écran s'appliquent à la largeur de l'aperçu et non à celle
   de la fenêtre. */
.palette-hote { container-type: inline-size; }
.palette-hote .palette__boite { box-shadow: var(--o-pose); }

/* --- Champ --------------------------------------------------------------- */
.palette__champ {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-3) var(--e-4);
  border-bottom: 1px solid var(--c-trait);
  flex: none;
}
.palette__champ > svg { flex: none; color: var(--c-encre-3); }
.palette__saisie {
  flex: 1; min-width: 0; border: 0; outline: none; background: none;
  font-family: var(--f-ui); font-size: var(--t-t3); font-weight: var(--g-moyen);
  letter-spacing: -.008em;
}
.palette__saisie::placeholder { color: var(--c-encre-4); font-weight: var(--g-normal); }
.palette__saisie::-webkit-search-cancel-button { display: none; }
.palette__effacer {
  flex: none; border: 0; background: none; cursor: pointer; padding: 4px;
  color: var(--c-encre-3); border-radius: var(--r-1); line-height: 0;
}
.palette__effacer:hover { background: var(--c-fond-creux); color: var(--c-encre); }

/* Curseur simulé : un aperçu statique n'a pas le focus, et sans repère il ne
   dit pas où en est la frappe. */
.palette__curseur {
  display: none; width: 1.5px; height: 22px; background: var(--c-accent); flex: none;
  animation: clignote 1.06s steps(2, start) infinite;
}
.palette__boite[data-curseur="oui"] .palette__curseur { display: block; }
@keyframes clignote { 50% { opacity: 0; } }

/* --- Bandeau de mode dégradé ---------------------------------------------- */
.palette__degrade {
  display: none; align-items: center; gap: var(--e-2);
  padding: var(--e-2) var(--e-4);
  background: var(--c-alerte-voile); border-bottom: 1px solid #dcc59a;
  font-size: var(--t-mini); color: var(--c-alerte); flex: none;
}
.palette__boite[data-degrade="oui"] .palette__degrade { display: flex; }

/* --- Liste ----------------------------------------------------------------- */
.palette__liste { overflow-y: auto; padding: var(--e-2); flex: 1; min-height: 0; }
.palette__groupe { padding: var(--e-2) var(--e-2) var(--e-1); }

.pres {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center;
  gap: var(--e-3);
  width: 100%; text-align: left;
  padding: var(--e-2) var(--e-3);
  border: 1px solid transparent; border-radius: var(--r-2);
  background: none; cursor: pointer; color: inherit; font-family: inherit;
  text-decoration: none;
}
.pres:hover { background: var(--c-papier-2); }
/* Le résultat sélectionné au clavier est distinct du survol souris : fond
   accentué et repère de bord, là où le survol ne pose qu'un fond neutre. */
.pres[data-sel="oui"] {
  background: var(--c-accent-voile);
  border-color: var(--c-accent-trait);
  box-shadow: inset 3px 0 0 var(--c-accent);
}
.pres__glyphe {
  width: 28px; height: 28px; flex: none; border-radius: var(--r-2);
  display: grid; place-items: center;
  background: var(--c-fond-creux); color: var(--c-encre-2);
  font-family: var(--f-donnee); font-size: var(--t-micro); font-weight: var(--g-lourd);
}
.pres[data-sel="oui"] .pres__glyphe { background: var(--c-accent); color: #fff; }
.pres__corps { min-width: 0; }
.pres__titre {
  font-size: var(--t-base); font-weight: var(--g-moyen); line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pres__titre mark { background: #f6e9a8; color: inherit; border-radius: var(--r-1); padding: 0 2px; }
.pres__sous {
  display: flex; align-items: center; gap: var(--e-2);
  font-size: var(--t-mini); color: var(--c-encre-3); margin-top: 2px;
  overflow: hidden; white-space: nowrap;
}
.pres__sous .temoin { flex: none; }
.pres__entree {
  font-family: var(--f-donnee); font-size: var(--t-micro); color: var(--c-encre-3);
  opacity: 0; flex: none;
}
.pres[data-sel="oui"] .pres__entree { opacity: 1; color: var(--c-accent); }

/* --- États ------------------------------------------------------------------ */
.palette__etat { padding: var(--e-6) var(--e-5); text-align: center; }
.palette__etat p { margin: 0 0 var(--e-3); font-size: var(--t-petit); color: var(--c-encre-3); line-height: 1.55; }
.palette__etat strong { color: var(--c-encre); }
.palette__requete { font-family: var(--f-lecture); font-style: italic; color: var(--c-encre); }

/* --- Pied --------------------------------------------------------------------- */
.palette__pied {
  display: flex; align-items: center; justify-content: space-between; gap: var(--e-3);
  padding: var(--e-2) var(--e-4);
  border-top: 1px solid var(--c-trait);
  background: var(--c-papier-2);
  flex: none;
}
.palette__aides { display: flex; align-items: center; gap: var(--e-4); flex-wrap: wrap; }
.palette__aide { display: inline-flex; align-items: center; gap: var(--e-1); font-size: var(--t-micro); color: var(--c-encre-3); }
.palette__droite { display: flex; align-items: center; gap: var(--e-3); flex: none; }
.palette__compteur { font-family: var(--f-donnee); font-size: var(--t-micro); color: var(--c-encre-3); }
.palette__tous {
  font-size: var(--t-mini); font-weight: var(--g-fort); color: var(--c-accent);
  background: none; border: 0; cursor: pointer; padding: 4px var(--e-2); border-radius: var(--r-2);
  white-space: nowrap;
}
.palette__tous:hover { background: var(--c-accent-voile); }
.palette__fermer { display: none; }

/* --- Petit écran : la palette occupe la quasi-totalité de l'écran ------------- */
@media (max-width: 700px) {
  .palette[open] .palette__boite {
    top: 0; left: 0; transform: none;
    width: 100vw; height: 100dvh; max-height: none; border-radius: 0; border: 0;
  }
  .palette__fermer { display: inline-flex; }
  .palette__aides { display: none; }
}
@container (max-width: 430px) {
  .palette__fermer { display: inline-flex; }
  .palette__aides { display: none; }
  .palette__saisie { font-size: var(--t-base); }
  .pres__sous .temoin__txt { display: none; }
}

/* ==========================================================================
   V-41 — BIBLIOTHÈQUE DE COMPOSANTS
   Démonstration vivante. Chaque élément porte son nom et une phrase disant
   quand l'employer : c'est cette phrase, plus que l'image, qui empêche deux
   écrans de diverger.
   ========================================================================== */
.biblio { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: calc(100vh - var(--l-barre)); }

/* --- Sommaire collant ------------------------------------------------------------ */
.sommaire-b {
  border-right: 1px solid var(--c-trait); background: var(--c-papier);
  padding: var(--e-4) var(--e-2);
  position: sticky; top: var(--l-barre); align-self: start;
  max-height: calc(100vh - var(--l-barre)); overflow-y: auto;
}
.sommaire-b a {
  display: block; padding: 6px var(--e-3);
  border-radius: var(--r-2); text-decoration: none;
  font-size: var(--t-petit); color: var(--c-encre-2);
}
.sommaire-b a:hover { background: var(--c-papier-2); color: var(--c-encre); }
.sommaire-b a[aria-current="true"] {
  background: var(--c-accent-voile); color: var(--c-accent-fonce);
  font-weight: var(--g-fort); box-shadow: inset 3px 0 0 var(--c-accent);
}

.corps-b { min-width: 0; padding: var(--e-5) var(--e-5) var(--e-8); max-width: 1060px; }

.famille { margin-bottom: var(--e-8); scroll-margin-top: calc(var(--l-barre) + var(--e-4)); }
.famille__nom {
  font-family: var(--f-ui); font-size: var(--t-t1); font-weight: var(--g-lourd);
  letter-spacing: -.02em; margin: 0 0 var(--e-2);
  padding-bottom: var(--e-2); border-bottom: 2px solid var(--c-encre);
}
.famille__sous { font-family: var(--f-lecture); font-size: var(--t-petit); line-height: 1.6; color: var(--c-encre-2); margin: 0 0 var(--e-4); max-width: 64ch; }

/* --- Fiche d'un composant --------------------------------------------------------
   Nom, phrase d'emploi, puis démonstration. L'ordre compte : on lit la règle
   avant de voir la forme. */
.compo {
  border: 1px solid var(--c-trait); border-radius: var(--r-3);
  background: var(--c-papier); box-shadow: var(--o-pose);
  margin-bottom: var(--e-3); overflow: hidden;
}
.compo__tete { padding: var(--e-3) var(--e-4); border-bottom: 1px solid var(--c-trait-fin); }
.compo__nom { font-family: var(--f-ui); font-size: var(--t-base); font-weight: var(--g-lourd); letter-spacing: -.01em; }
.compo__quand { font-size: var(--t-mini); color: var(--c-encre-2); line-height: 1.5; margin-top: 3px; max-width: 74ch; }
.compo__quand b { color: var(--c-encre); font-weight: var(--g-fort); }
.compo__demo {
  padding: var(--e-4); background: var(--c-fond);
  display: flex; flex-wrap: wrap; gap: var(--e-3); align-items: center;
}
.compo__demo--pile { flex-direction: column; align-items: stretch; }
.compo__demo--grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); align-items: start; }
.echantillon { display: flex; flex-direction: column; gap: var(--e-2); align-items: flex-start; }
.echantillon__nom { font-family: var(--f-donnee); font-size: var(--t-micro); color: var(--c-encre-3); }

/* --- Éléments propres à cette planche --------------------------------------------- */
.onglets-d { display: flex; gap: var(--e-1); border-bottom: 1px solid var(--c-trait); width: 100%; }
.onglets-d button {
  border: 0; background: none; cursor: pointer;
  padding: var(--e-2) var(--e-3); margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  font-family: var(--f-ui); font-size: var(--t-petit); font-weight: var(--g-moyen); color: var(--c-encre-2);
}
.onglets-d button[aria-selected="true"] { color: var(--c-accent-fonce); font-weight: var(--g-lourd); border-bottom-color: var(--c-accent); }

.pagination { display: flex; align-items: center; gap: var(--e-1); }
.pagination button {
  min-width: 30px; height: 30px; padding: 0 var(--e-2);
  border: 1px solid var(--c-trait); border-radius: var(--r-2);
  background: var(--c-papier); cursor: pointer;
  font-family: var(--f-donnee); font-size: var(--t-mini); color: var(--c-encre-2);
}
.pagination button:hover:not(:disabled) { border-color: var(--c-accent); color: var(--c-accent); }
.pagination button[aria-current="page"] { background: var(--c-encre); border-color: var(--c-encre); color: var(--c-papier); font-weight: var(--g-lourd); }
.pagination button:disabled { opacity: .35; cursor: not-allowed; }
.pagination__saut { font-family: var(--f-donnee); font-size: var(--t-mini); color: var(--c-encre-4); padding: 0 4px; }

.tableau-tri { width: 100%; border-collapse: collapse; background: var(--c-papier); font-size: var(--t-petit); }
.tableau-tri th {
  text-align: left; padding: var(--e-2) var(--e-3);
  border-bottom: 1px solid var(--c-trait); background: var(--c-papier-2);
  font-family: var(--f-donnee); font-size: var(--t-micro); font-weight: var(--g-moyen);
  letter-spacing: .07em; text-transform: uppercase; color: var(--c-encre-3);
}
.tableau-tri th button {
  display: inline-flex; align-items: center; gap: 4px;
  border: 0; background: none; cursor: pointer; padding: 0; font: inherit;
  letter-spacing: inherit; text-transform: inherit; color: inherit;
}
.tableau-tri th button:hover { color: var(--c-encre); }
.tableau-tri th[aria-sort] button { color: var(--c-encre); }
.tableau-tri td { padding: var(--e-2) var(--e-3); border-bottom: 1px solid var(--c-trait-fin); }
.tableau-tri td.n { font-family: var(--f-donnee); text-align: right; }

.chrono { list-style: none; margin: 0; padding: 0 0 0 var(--e-5); border-left: 1px solid var(--c-trait); }
.chrono li { position: relative; padding-bottom: var(--e-4); }
.chrono li:last-child { padding-bottom: 0; }
.chrono li::before {
  content: ""; position: absolute; left: calc(var(--e-5) * -1 - 4px); top: 4px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--c-papier); box-shadow: 0 0 0 1.5px var(--c-trait-fort);
}
.chrono li[data-marque="fait"]::before { background: var(--c-frais); box-shadow: 0 0 0 1.5px var(--c-frais); }
.chrono__txt { font-size: var(--t-petit); line-height: 1.5; }
.chrono__quand { font-family: var(--f-donnee); font-size: var(--t-mini); color: var(--c-encre-3); display: block; margin-top: 2px; }

.indicateur { border: 1px solid var(--c-trait); border-radius: var(--r-3); background: var(--c-papier); padding: var(--e-4); min-width: 172px; }
.indicateur__val { font-family: var(--f-donnee); font-size: var(--t-t1); font-weight: var(--g-lourd); line-height: 1; letter-spacing: -.03em; }
.indicateur__nom { display: block; font-size: var(--t-mini); color: var(--c-encre-3); margin-top: var(--e-2); }
.tendance-c { display: inline-flex; align-items: center; gap: 3px; font-family: var(--f-donnee); font-size: var(--t-mini); font-weight: var(--g-lourd); margin-top: var(--e-2); }
.tendance-c[data-sens="hausse"] { color: var(--c-frais); }
.tendance-c[data-sens="baisse"] { color: var(--c-obsolete); }
.tendance-c[data-sens="stable"] { color: var(--c-encre-3); }

.piles { display: flex; }
.piles .avatar-p {
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c-encre-2); color: #fff;
  font-size: var(--t-mini); font-weight: var(--g-lourd);
  box-shadow: 0 0 0 2px var(--c-fond);
}
.piles .avatar-p + .avatar-p { margin-left: -9px; }
.piles .avatar-p--reste { background: var(--c-papier); color: var(--c-encre-2); box-shadow: 0 0 0 2px var(--c-fond), inset 0 0 0 1px var(--c-trait-fort); }

.infobulle-h { position: relative; display: inline-flex; }
.infobulle {
  position: absolute; z-index: 5; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: var(--c-encre); color: var(--c-papier);
  padding: 6px var(--e-3); border-radius: var(--r-2);
  font-size: var(--t-mini); line-height: 1.4; white-space: nowrap;
  box-shadow: var(--o-flotte);
  opacity: 0; pointer-events: none; transition: opacity var(--m-vif);
}
.infobulle::after {
  content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  border: 5px solid transparent; border-top-color: var(--c-encre);
}
.infobulle-h:hover .infobulle, .infobulle-h:focus-within .infobulle { opacity: 1; }

.menu-ctx {
  min-width: 208px; padding: var(--e-1);
  background: var(--c-papier); border: 1px solid var(--c-trait-fort);
  border-radius: var(--r-3); box-shadow: var(--o-flotte);
}
.menu-ctx button {
  display: flex; align-items: center; gap: var(--e-3); width: 100%;
  padding: var(--e-2); border: 0; background: none; cursor: pointer;
  border-radius: var(--r-2); text-align: left;
  font-family: var(--f-ui); font-size: var(--t-petit); color: var(--c-encre);
}
.menu-ctx button:hover { background: var(--c-papier-2); }
.menu-ctx button.destructif { color: var(--c-danger); }
.menu-ctx button.destructif:hover { background: var(--c-danger-voile); }
.menu-ctx__sep { height: 1px; background: var(--c-trait-fin); margin: var(--e-1) 0; }
.menu-ctx__raccourci { margin-left: auto; font-family: var(--f-donnee); font-size: var(--t-micro); color: var(--c-encre-4); }

.encart-b {
  border: 1px solid var(--c-trait); border-left: 4px solid var(--c-accent);
  border-radius: var(--r-3); background: var(--c-papier);
  padding: var(--e-3) var(--e-4); font-size: var(--t-petit); line-height: 1.55;
}

.duo-b { display: flex; gap: var(--e-1); padding: 2px; background: var(--c-fond-creux); border: 1px solid var(--c-trait); border-radius: var(--r-2); }
.duo-b button {
  border: 0; background: none; cursor: pointer;
  padding: 6px var(--e-3); border-radius: var(--r-1);
  font-family: var(--f-ui); font-size: var(--t-mini); font-weight: var(--g-fort); color: var(--c-encre-2);
}
.duo-b button[aria-pressed="true"] { background: var(--c-papier); color: var(--c-encre); box-shadow: var(--o-pose); }

.interrupteur { display: inline-flex; align-items: center; gap: var(--e-2); font-size: var(--t-petit); cursor: pointer; }
.interrupteur input { position: absolute; opacity: 0; pointer-events: none; }
.interrupteur__piste { width: 34px; height: 19px; border-radius: 10px; background: var(--c-trait-fort); position: relative; flex: none; transition: background var(--m-vif); }
.interrupteur__piste::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform var(--m-vif); }
.interrupteur input:checked + .interrupteur__piste { background: var(--c-accent); }
.interrupteur input:checked + .interrupteur__piste::after { transform: translateX(15px); }
.interrupteur input:disabled + .interrupteur__piste { opacity: .45; }

.dossier-choix-b {
  border: 1px solid var(--c-trait-fort); border-radius: var(--r-2);
  background: var(--c-papier); max-height: 140px; overflow-y: auto; padding: var(--e-1); width: 100%;
}
.dossier-choix-b ul { list-style: none; margin: 0; padding: 0 0 0 var(--e-4); }
.dossier-choix-b > ul { padding-left: 0; }
.dc-b { display: flex; align-items: center; gap: var(--e-2); padding: 4px var(--e-2); border-radius: var(--r-2); font-size: var(--t-petit); cursor: pointer; }
.dc-b:hover { background: var(--c-papier-2); }
.dc-b input { accent-color: var(--c-accent); margin: 0; flex: none; }

@media (max-width: 1240px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .rail { display: none; }
}
@media (max-width: 900px) {
  .biblio { grid-template-columns: minmax(0, 1fr); }
  .sommaire-b {
    position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--c-trait);
    display: flex; gap: var(--e-1); overflow-x: auto; padding: var(--e-2) var(--e-3);
  }
  .sommaire-b a { white-space: nowrap; }
  .corps-b { padding: var(--e-4) var(--e-4) var(--e-7); }
}

/* --- Barre supérieure sur petit écran --------------------------------------
   La barre doit tenir à 360 px sans provoquer de défilement horizontal de la
   page (RG-M18-12) : le champ de recherche devient élastique et lâche ses
   rappels clavier, qui n'ont pas de sens sans clavier physique. */
@media (max-width: 640px) {
  .barre { padding: 0 var(--e-3); gap: var(--e-2); }
  .recherche { width: auto; flex: 1 1 90px; min-width: 0; }
  .recherche .touche { display: none; }
  .recherche__txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fil { flex: 0 1 auto; }
  /* Le fil d'Ariane ne tient pas sur 360 px : seul le segment courant reste,
     les ancêtres restent atteignables par le rail. */
  .fil > *:not(.fil__courant) { display: none; }
  .fil__courant { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}

/* --- Contenus larges : le débordement reste dans son bloc ------------------
   Un tableau ou un bloc de code trop large défile dans son propre cadre ; il
   ne fait jamais défiler la page entière (RG-M18-12). */
.bloc-code pre { overflow-x: auto; }
.tableau-boite { overflow-x: auto; }
.ligne-note__titre { display: block; }

/* --- Fil d'Ariane : ne pousse jamais la page ------------------------------
   Le titre d'une note peut être long, et les segments ne se coupent pas tout
   seuls : sans troncature, le fil élargit la barre, qui élargit la grille, qui
   fait défiler la page. Le défaut ne se voyait qu'à 768 px — entre les deux
   largeurs qu'on regarde d'ordinaire. */
.fil { overflow: hidden; }
.fil > * { min-width: 0; flex: 0 1 auto; }
.fil__courant { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
