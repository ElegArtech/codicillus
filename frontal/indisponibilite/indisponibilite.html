			Elle est donc posée ici dans sa forme la plus sobre possible, sans

			cette page vit hors de l'application. Sa forme définitive et son texte
			relèvent du lot T-058 (« Exploitation : sauvegarde, restauration,
			indisponibilité », vague 11) et d'un arbitrage. Déclaré au rapport de
			T-003, écart É-2 : c'est un vide de spécification signalé, pas comblé.
