<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Les trois familles typographiques du socle, servies par l'application
			elle-même depuis `static/polices/` — jamais par une fonderie distante
			(RG-NF-08, ADR-002 « conséquences », risque RA-12). Les `url()` de
			`polices.css` sont relatifs et les woff2 sont dans le même répertoire :
			servis sous `/polices/`, ils résolvent en `/polices/<fichier>.woff2`.
			Le répertoire est installé par `pnpm socle:extraire` depuis
			`mockups/polices/` ; `pnpm verif:jetons` en prouve l'identité au gel.
		-->
		<!--
			LES NEUF FACES QUE CHAQUE ÉCRAN EMPLOIE, DEMANDÉES DÈS L'ANALYSE DE
			L'EN-TÊTE. Sans cela le navigateur ne les découvre qu'après avoir chargé
			`polices.css`, l'avoir analysé, puis calculé la mise en page : trois
			étapes en série avant la première requête. Mesuré sur l'instance : le
			titre d'un univers se rendait en 1236 × 41 px dans la police de repli,
			puis en 675 × 50 px trente-quatre millisecondes plus tard — tout l'écran
			se recalait sous les yeux, à chaque ouverture de page.

			`crossorigin` N'EST PAS FACULTATIF, MÊME ICI. Une police se récupère
			toujours en mode anonyme ; sans l'attribut, le préchargement et la requête
			de `@font-face` ne sont pas la même requête, et le fichier part deux fois.

			LES SOUS-ENSEMBLES `latin-ext` NE SONT PAS PRÉCHARGÉS : l'interface est en
			français, ils ne servent qu'aux caractères que `unicode-range` leur
			réserve, et le navigateur ne les demande que s'il en rencontre un.
		-->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/archivo-400-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/archivo-500-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/archivo-600-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/archivo-700-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/literata-400-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/literata-600-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/jetbrains-mono-400-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/jetbrains-mono-500-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/jetbrains-mono-700-normal-latin.woff2"
		/>
		<link rel="stylesheet" href="%sveltekit.assets%/polices/polices.css" />
		<!--
			LA MARQUE DE L'ONGLET — le sceau du rail, rien d'autre : un « C » de
			Literata 600 en papier sur le vert d'accent, aux mêmes proportions
			(`socle.css:319`). Il n'en existait AUCUN fichier dans le dépôt, et
			`/favicon.ico` répondait 404 à chaque ouverture.

			`favicon.ico` PORTE TROIS TAILLES — 16, 32 et 48 — parce que c'est
			l'adresse que tout navigateur demande de lui-même, sans qu'on la déclare :
			elle doit suffire seule. Le PNG de 32 et l'icône Apple de 180 sont là pour
			les clients qui préfèrent les lire dans la déclaration.

			Le carré d'Apple N'EST PAS ARRONDI : le système l'arrondit lui-même, et
			un coin déjà rogné y donnerait un double arrondi.
		-->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
