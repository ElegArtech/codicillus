<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			LES NEUF FACES QUE CHAQUE ÉCRAN EMPLOIE, DEMANDÉES DÈS L'ANALYSE DE
			L'EN-TÊTE. Sans cela le navigateur ne les découvre qu'après avoir chargé
			`polices.css`, l'avoir analysé, puis calculé la mise en page : trois
			étapes en série avant la première requête. Mesuré sur l'instance : le
			titre d'un univers se rendait en 1236 × 41 px dans la police de repli,
			puis en 675 × 50 px trente-quatre millisecondes plus tard — tout l'écran
			se recalait sous les yeux, à chaque ouverture de page.

			`crossorigin` N'EST PAS FACULTATIF, MÊME ICI. Une police se récupère
			toujours en mode anonyme ; sans l'attribut, le préchargement et la requête
			de `@font-face` ne sont pas la même requête, et le fichier part deux fois.

			LES SOUS-ENSEMBLES `latin-ext` NE SONT PAS PRÉCHARGÉS : l'interface est en
			français, ils ne servent qu'aux caractères que `unicode-range` leur
			réserve, et le navigateur ne les demande que s'il en rencontre un.
		-->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/archivo-400-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/archivo-500-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/archivo-600-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/archivo-700-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/literata-400-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/literata-600-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/jetbrains-mono-400-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/jetbrains-mono-500-normal-latin.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/polices/jetbrains-mono-700-normal-latin.woff2"
		/>
		<link rel="stylesheet" href="%sveltekit.assets%/polices/polices.css" />
		<!--
			LA MARQUE DE L'ONGLET. Les trois fichiers sont tirés du logo fourni dans
			`asset/logo.png`, recadré sur son contenu puis réduit. Aucun trait n'est
			redessiné.

			Le PNG de 32 est déclaré seul comme favicon afin que tous les navigateurs
			rendent exactement la même vignette que le site de présentation. L'icône
			Apple de 180 reste dédiée aux raccourcis sur l'écran d'accueil.

			LE CARRÉ D'APPLE EST APLATI SUR LE VERT DE LA VIGNETTE : le système ignore
			la transparence et arrondit lui-même. Des coins transparents y donneraient
			un liseré noir, et un coin déjà rogné un double arrondi.
		-->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
