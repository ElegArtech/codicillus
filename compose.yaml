# Installation depuis les images publiées ; MODE_IMAGES=never pour une instance hors ligne.
# La construction est définie séparément dans compose.construction.yaml.
name: ${NOM_PROJET:-codicillus}

x-environnement: &environnement
  HOTE_BASE: db
  PORT_BASE: '5432'
  UTILISATEUR_BASE: ${UTILISATEUR_POSTGRES:-codicillus}
  MDP_BASE: ${MDP_POSTGRES:?renseigner MDP_POSTGRES dans .env}
  NOM_BASE: ${BASE_POSTGRES:-codicillus}
  URL_RECHERCHE: http://recherche:7700
  CLE_RECHERCHE: ${CLE_MAITRE_RECHERCHE:?renseigner CLE_MAITRE_RECHERCHE dans .env}
  URL_CONVERSION: http://conversion:8000
  RACINE_FICHIERS: /var/lib/codicillus/fichiers

services:
  frontal:
    image: caddy:2.11.4-alpine
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    environment:
      ADRESSE_SITE: ${ADRESSE_SITE:?renseigner ADRESSE_SITE dans .env}
      DIRECTIVE_TLS: ${DIRECTIVE_TLS:-}
      DIRECTIVE_COURRIEL_ACME: ${COURRIEL_ACME:+email ${COURRIEL_ACME:-}}
    ports:
      - '${PORT_HTTP:-19080}:80'
      - '${PORT_HTTPS:-19443}:443'
    volumes:
      - ./frontal/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontal/indisponibilite:/srv/indisponibilite:ro
      - ./certificats:/etc/codicillus/certificats:ro
      - caddy_donnees:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/_sante']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_healthy
    networks: [codicillus, acces]

  initialisation:
    image: ${REGISTRE_CODICILLUS:-ghcr.io/elegartech}/codicillus-gestion:${VERSION_CODICILLUS:-1.0.0-rc.2}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: 'no'
    command: ['base:initialiser']
    environment:
      <<: *environnement
      ADMIN_IDENTIFIANT: ${ADMIN_IDENTIFIANT:-}
      ADMIN_NOM: ${ADMIN_NOM:-}
      ADMIN_COURRIEL: ${ADMIN_COURRIEL:-}
      MDP_ADMINISTRATEUR: ${MDP_ADMINISTRATEUR:-}
    volumes:
      - fichiers:/var/lib/codicillus/fichiers
    depends_on:
      db:
        condition: service_healthy
      recherche:
        condition: service_healthy
    networks: [codicillus]

  app:
    image: ${REGISTRE_CODICILLUS:-ghcr.io/elegartech}/codicillus:${VERSION_CODICILLUS:-1.0.0-rc.2}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    depends_on:
      initialisation:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      recherche:
        condition: service_healthy
    environment:
      <<: *environnement
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      ORIGIN: ${ORIGINE_PUBLIQUE:-${ADRESSE_SITE}}
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
      BODY_SIZE_LIMIT: 128M
    volumes:
      - fichiers:/var/lib/codicillus/fichiers
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [codicillus]

  gestion:
    image: ${REGISTRE_CODICILLUS:-ghcr.io/elegartech}/codicillus-gestion:${VERSION_CODICILLUS:-1.0.0-rc.2}
    pull_policy: ${MODE_IMAGES:-missing}
    profiles: [gestion]
    environment:
      <<: *environnement
      ADMIN_IDENTIFIANT: ${ADMIN_IDENTIFIANT:-}
      ADMIN_NOM: ${ADMIN_NOM:-}
      ADMIN_COURRIEL: ${ADMIN_COURRIEL:-}
      MDP_ADMINISTRATEUR: ${MDP_ADMINISTRATEUR:-}
    volumes:
      - fichiers:/var/lib/codicillus/fichiers
    depends_on:
      db:
        condition: service_healthy
      recherche:
        condition: service_healthy
    networks: [codicillus]

  db:
    image: pgvector/pgvector:pg18
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${UTILISATEUR_POSTGRES:-codicillus}
      POSTGRES_PASSWORD: ${MDP_POSTGRES:?renseigner MDP_POSTGRES dans .env}
      POSTGRES_DB: ${BASE_POSTGRES:-codicillus}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - db_donnees:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [codicillus]

  recherche:
    image: getmeili/meilisearch:v1.53.1
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${CLE_MAITRE_RECHERCHE:?renseigner CLE_MAITRE_RECHERCHE dans .env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - recherche_donnees:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [codicillus]

  conversion:
    image: ${REGISTRE_CODICILLUS:-ghcr.io/elegartech}/codicillus-conversion:${VERSION_CODICILLUS:-1.0.0-rc.2}
    pull_policy: ${MODE_IMAGES:-missing}
    profiles: [conversion]
    restart: unless-stopped
    environment:
      DELAI_MAX_CONVERSION: ${DELAI_MAX_CONVERSION:-120}
    networks: [codicillus]

networks:
  acces:
    driver: bridge
  codicillus:
    driver: bridge
    internal: ${RESEAU_INTERNE:-false}

volumes:
  db_donnees:
  fichiers:
  recherche_donnees:
  caddy_donnees:
  caddy_config:
